<script>
// ════════════════════════════════════════════════════════════════════
//  FIST OF THE NORTH STAR — WASTELAND BRAWLER  (2-Player + Joypad)
// ════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
GAME_I18N.install(ctx);
GAME_I18N.setLanguage(GAME_I18N.language);
const languageSelect=document.getElementById('languageSelect');
languageSelect.value=GAME_I18N.language;
languageSelect.addEventListener('change',()=>{GAME_I18N.setLanguage(languageSelect.value);languageSelect.blur();});
const W = 1280, H = 720;
// Match physical display pixels while keeping gameplay coordinates at 1280×720.
function resizeGameCanvas() {
  const rect=canvas.getBoundingClientRect?.();
  const ratio=Math.min(2,Math.max(1,window.devicePixelRatio||1));
  const scale=Math.max(.25,(rect?.width||W)/W*ratio);
  const width=Math.round(W*scale),height=Math.round(H*scale);
  if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
  ctx.setTransform(width/W,0,0,height/H,0,0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
}
window.addEventListener('resize',resizeGameCanvas);
resizeGameCanvas();

const GROUND_Y = 590;
const LANE_BACK = 519, LANE_FRONT = 645;
function fighterDepthScale(y) {
  return 1.008 + .252 * Math.max(0,Math.min(1,(y-LANE_BACK)/(LANE_FRONT-LANE_BACK)));
}
const LEVEL_W  = 10240;

// ─── SPRITE SYSTEM ──────────────────────────────────────────────────
// Loads the inline manifest. Kenshiro uses ken_S1.png and ken_S2.png.
const SPR       = {};          // name → { img, dw, dh }
const CHARACTER_IMAGES = {};
const ENEMY_WALK_IMAGES={};
for(const name of ['scavenger','thug','gang','heavy','spear','knife','shield','nanto','gunner','whip','bomber','elite']){
  const image=new Image();image.src=`assets/characters/${name}-walk-v3.png`;ENEMY_WALK_IMAGES[name]=image;
}
const SCAVENGER_WALK_IMAGE=ENEMY_WALK_IMAGES.scavenger;
for (const [key, info] of Object.entries(window.CHARACTER_ART || {})) {
  const img = new Image();
  CHARACTER_IMAGES[key] = {...info, img};

// Six authored poses: guard, two strides, windup, impact, and hit reaction.
// Attack selection follows the live combat window, never a looping attack GIF.
function characterArtPose(r) {
  if (['stunned','knockdown','dying','getup'].includes(r.state)) return 5;
  if(r.blockT>0)return 0;
  if (r.attack) {
    const a=r.attack, t=a.elapsed, active=a.active||4;
    if(t<a.startup) return t<a.startup*.25?0:3;
    if(t<a.startup+active) return 4;
    return (t-a.startup-active)<a.recovery*.35?3:0;
  }
  if((r.def||r.profile) && r.stride!==undefined) {
    if(!['walk','approach'].includes(r.state)||r.walkBlend<.03)return 0;
    // Contact, passing, opposite contact, passing. Advance only with travel.
    return [1,1,0,0,2,2,0,0][Math.floor(r.stride/ENEMY_MOTION.strideDistance*8)%8];
  }
  return ['walk','approach'].includes(r.state)?[1,0,2,0][Math.floor(r.fr/8)%4]:0;
}
function tryDrawCharacterArt(r) {
  const key=(r.name || r.type || '').toLowerCase().replaceAll(' ','-');
  const s=CHARACTER_IMAGES[key];
  if(!s || !s.img.complete || !s.img.naturalWidth) return false;
  if(r.invincible>0 && Math.floor(r.invincible/5)%2) return true;
  if(!['stunned','knockdown','dying','getup'].includes(r.state)&&drawEnemyWeapon(r,s))return true;
  const walkImage=ENEMY_WALK_IMAGES[key];
  if(walkImage&&!r.blockT&&!r.attack&&['walk','approach'].includes(r.state)&&r.walkBlend>.03&&walkImage.complete&&walkImage.naturalWidth){
    const image=walkImage,w=image.naturalWidth/4,h=image.naturalHeight/2;
    const frame=Math.floor(visualValue(r,'stride')/ENEMY_MOTION.strideDistance*8)%8;
    const scale=s.height/(h-16);
    ctx.save();ctx.scale(r.dir<0?-1:1,1);
    ctx.drawImage(image,frame%4*w,Math.floor(frame/4)*h,w,h,-w*scale/2,-(h-8)*scale,w*scale,h*scale);
    ctx.restore();return true;
  }
  const pose=characterArtPose(r), scale=s.height/(s.cellH-8);
  ctx.save();ctx.scale(r.dir<0?-1:1,1);
  if((r.def||r.profile) && !r.attack && !['stunned','knockdown','dying','getup'].includes(r.state)) {
    const weight=r.walkBlend||0,phase=visualValue(r,'stride')/ENEMY_MOTION.strideDistance*Math.PI*2;
    // Small weight transfers between the authored poses; feet remain grounded.
    ctx.translate(0,-(1-Math.cos(phase*2))*.7*weight);
    ctx.transform(1,0,-.012*weight,1,0,0);
    ctx.scale(1,1+Math.sin(visualValue(r,'motionFr')*.035+(r.idlePhase||0))*.005*(1-weight));
  }
  if(r.attack&&!['stunned','knockdown','dying','getup'].includes(r.state)){
    const a=r.attack,t=a.elapsed+(smoothRender?renderAlpha:0),active=a.active||4;
    const ease=v=>{v=clmp(v,0,1);return v*v*(3-2*v);};

}

function prepareSheetFrames(img, regions, anchors) {

async function loadSprites() {
  // Manifest is inlined in the HTML — always available immediately
  const manifest = window.SPRITE_MANIFEST;
  if (!manifest) { sprReady = true; return; }

  const entries = Object.entries(manifest.sprites || {});
  // Selection uses the original detailed portrait, independently of gameplay art.
  entries.push(['ken_portrait', {
    sheet:'assets/sprites/ken_S1.png', regions:KEN_REGIONS.ken_idle,
    anchors:KEN_ANCHORS.ken_idle, scale:182/256,
  }]);
  if (entries.length === 0) { sprReady = true; return; }

  // Count total images (multi-frame sprites have several)
  entries.forEach(([, info]) => {
    sprCount += Array.isArray(info.frames) ? info.frames.length : 1;
  });

  await Promise.all(entries.map(([name, info]) => new Promise(async res => {
    const dw = info.dw || null, dh = info.dh || null;
    if (Array.isArray(info.frames)) {
      // Animated sprite — load every frame image
      const imgs = await Promise.all(info.frames.map(p => new Promise(r => {
        const img = new Image();
        img.onload  = () => { sprDone++; r(img); };
        img.onerror = () => { sprDone++; r(null); };
        img.src = p;
      })));
      const valid = imgs.filter(Boolean);
      if (valid.length) SPR[name] = { frames: valid, dw, dh };
    } else if (info.sheet) {
      // Sprite sheet — single image, frames sliced at render time
      const img = new Image();
      img.onload  = () => {
        if (info.regions) {
          SPR[name] = { poses: prepareSheetFrames(img, info.regions, info.anchors), scale: info.scale, dh };
        } else if (KEN_REGIONS[name]) {
          try {
            SPR[name] = { poses: prepareSheetFrames(img, KEN_REGIONS[name], KEN_ANCHORS[name]), scale: 182/256 };
          } catch (error) { console.warn('Sprite processing unavailable:', name, error); }
        } else SPR[name] = { sheetImg: img, frameW: info.frameW, sy: info.sy,
                      frameH: info.frameH, cols: info.cols, dw, dh };
        sprDone++; res();
      };
      img.onerror = () => { sprDone++; res(); };
      img.src = info.sheet;
      return;
    } else {
      // Single image (background, or old-format sprite)
      const path = typeof info === 'string' ? info : info.path;
      const img  = new Image();
      img.onload  = () => { SPR[name] = { img, dw, dh }; sprDone++; res(); };
      img.onerror = () => { sprDone++; res(); };
      img.src = path;
      return; // res() called inside callbacks
    }
    res();
  })));

  sprReady = true;
  console.log(`Sprites loaded: ${Object.keys(SPR).length} / ${sprCount} (${sprDone} images)`);
}

// ── Per-state animation timing (game runs at 60fps) ─────────────────
const ANIM_STEP = 20;   // legacy default (3fps) — used by intro/title
// How many game frames each animation frame is held (per action state)
const ANIM_STEPS = {
  idle:    18,  // ~3.3fps — slow breathing cycle
  walk:     6,  // 10fps — complete authored stride cycle
  punch:    3,  // ~20fps  — snap punch through 6 frames in 18 ticks
  kick:     3,  // ~20fps  — kick through 6 frames in 18 ticks
  jumpkick: 3,
  special:  8,  // ~7.5fps — power-up continuous
  jump:     8,  // ~7.5fps — jump arc
  attack:   4,  // ~15fps  — enemy/boss attack
  approach: 10,
  stunned:  10,

function aStep(state) { return ANIM_STEPS[state] || ANIM_STEPS[state.replace(/_(high|low)$/,'')] || ANIM_STEP; }
// af() kept for scenes (intro/title) that still want global 3fps quantising
function af(fr) { return Math.floor(fr / ANIM_STEP) * ANIM_STEP; }

// Draw a sprite centred on (sx, bottom=sy), flipped when dir<0
// Falls back to calling fallbackFn if sprite not ready
function drawSpr(key, sx, sy, dir, invincible, fallbackFn, ...fbArgs) {
  if (invincible > 0 && Math.floor(invincible/5) % 2 === 1) return;
  const s = SPR[key];
  if (s && s.img && s.img.complete && s.img.naturalWidth > 0) {
    const dw = s.dw || 64, dh = s.dh || 96;
    ctx.save();
    ctx.translate(sx, sy);
    if (dir < 0) ctx.scale(-1, 1);
    ctx.drawImage(s.img, -dw/2, -dh, dw, dh);
    ctx.restore();
    return;
  }
  // canvas fallback
  fallbackFn(sx, sy, dir, ...fbArgs);
}

// Map state string → sprite key suffix
function stateKey(state) {
  if (state === 'jumpkick') return 'jumpkick';
  if (state === 'walk')    return 'walk';
  if (state === 'punch')   return 'punch';
  if (state === 'kick')    return 'kick';
  if (state === 'special') return 'special';
  if (state === 'jump')    return 'jump';
  if (state === 'attack')  return 'attack';   // boss / enemy attack state
  if (state === 'approach')return 'walk';     // enemy approaching = walking pose
  if (state === 'stunned') return 'idle';
  if (state === 'dying')   return 'idle';
  return 'idle';
}

// Try to draw a sprite; fr = raw p.fr counter, step = ticks-per-frame.
// Returns true if sprite handled rendering (draw or flicker-skip).
// Returns false when no sprite loaded → caller does canvas fallback.
function tryDrawSpr(key, sx, y, dir, invincible, fr, step) {
  const s = SPR[key];
  if (!s) return false;

  if (s.poses) {
    if (invincible > 0 && Math.floor(invincible / 5) % 2 === 1) return true;
    const count = s.poses.length;
    const tick = Math.floor(Math.max(0, fr || 0) / (step || ANIM_STEP));
    const once = /_(punch|kick|jumpkick|jump|special|stunned|knockdown|getup|landing|punch_high|punch_low|kick_high|kick_low)$/.test(key);
    // Idle returns through its poses instead of snapping from the last to first.
    const idleTick=key==='ken_idle'?Math.floor(Math.max(0,fr||0)/12)%(count*2-2):0;
    const pose = s.poses[key==='ken_idle'?(idleTick<count?idleTick:count*2-2-idleTick):once ? Math.min(tick, count-1) : tick % count];
    ctx.save(); ctx.translate(sx, y);
    if (dir < 0) ctx.scale(-1, 1);
    if (key.endsWith('_idle')) ctx.scale(1,1+Math.sin((fr||0)*.075)*.004);
    ctx.drawImage(pose, -(pose.anchorX ?? pose.width/2)*s.scale, -pose.height*s.scale,
                  pose.width*s.scale, pose.height*s.scale);
    ctx.restore();
    return true;
  }

  // Sprite sheet — slice frame at render time
  if (s.sheetImg) {
    if (!s.sheetImg.complete || !s.sheetImg.naturalWidth) return false;
    if (invincible > 0 && Math.floor(invincible / 5) % 2 === 1) return true;
    const st = step || ANIM_STEP;
    const frameIdx = Math.floor((fr || 0) / st) % s.cols;
    const dw = s.dw || 64, dh = s.dh || 96;
    ctx.save();
    ctx.translate(sx, y);
    if (dir < 0) ctx.scale(-1, 1);
    ctx.drawImage(s.sheetImg, frameIdx * s.frameW, s.sy, s.frameW, s.frameH, -dw / 2, -dh, dw, dh);
    ctx.restore();
    return true;
  }

  // Pick the right image (animated vs single)
  let img;
  if (s.frames && s.frames.length > 0) {
    const st = step || ANIM_STEP;
    const frameIdx = Math.floor((fr || 0) / st) % s.frames.length;
    img = s.frames[frameIdx];
  } else {
    img = s.img;
  }
  if (!img || !img.complete || !img.naturalWidth) return false;

  // Invincibility flicker — skip draw but report "handled"
  if (invincible > 0 && Math.floor(invincible / 5) % 2 === 1) return true;

  const dw = s.dw || 64, dh = s.dh || 96;
  ctx.save();
  ctx.translate(sx, y);
  if (dir < 0) ctx.scale(-1, 1);
  ctx.drawImage(img, -dw / 2, -dh, dw, dh);
  ctx.restore();
  return true;
}

window.addEventListener('gamepaddisconnected', e => { gpConnected[e.gamepad.index] = false; });

// ─── ABSTRACT INPUT PER PLAYER ──────────────────────────────────────
// Controls:
//   Jump              — U (P1) / Numpad 3 (P2) / Gamepad □ (btn2)
//   Punch             — H (P1) / Numpad 1 (P2) / Gamepad × (btn0)
//   Kick              — K (P1) / Numpad 2 (P2) / Gamepad ○ (btn1)
//   Jump Kick         — Jump then Kick while airborne
//   Special 1 (40%)   — Kick + Punch simultaneously
//   Special 2 (80%)   — Jump + Kick + Punch simultaneously
function getInput(pIdx) {
  const source=JOIN.enabled?JOIN.sources[pIdx]:null;
  const keyboard=JOIN.enabled?(source?.type==='keyboard'?source.id:-1):pIdx;
  const keyPress=(...codes)=>keyboard>=0&&press(...codes);
  const keyHeld=(...codes)=>keyboard>=0&&held(...codes);
  const DZ = INPUT_SETTINGS.deadzone;
  const pad = playerPad(pIdx);
  const ax  = gpAxis(pad, 0), rawAy = gpAxis(pad, 1);
  const ay  = INPUT_SETTINGS.invertY ? -rawAy : rawAy;
  const dpL = gpHeld(pad, 14), dpR = gpHeld(pad, 15);
  const dpU = gpHeld(pad, 12), dpD = gpHeld(pad, 13);

  const gpLeft  = ax < -DZ || dpL;
  const gpRight = ax >  DZ || dpR;
  const gpUp    = ay < -DZ || dpU;
  const gpDown  = ay >  DZ || dpD;

  // Raw "just pressed" and "held" per button
  let punchP, kickP, jumpP, punchH, kickH, jumpH;

  if (keyboard === 0) {
    punchP = keyPress('KeyH') || gpJustPressed(pad,0);
    kickP  = keyPress('KeyK') || gpJustPressed(pad,1);
    jumpP  = keyPress('KeyU') || gpJustPressed(pad,2);
    punchH = keyHeld('KeyH')  || gpHeld(pad,0);
    kickH  = keyHeld('KeyK')  || gpHeld(pad,1);
    jumpH  = keyHeld('KeyU')  || gpHeld(pad,2);
  } else {
    punchP = keyPress('Numpad1')        || gpJustPressed(pad,0);
    kickP  = keyPress('Numpad2')        || gpJustPressed(pad,1);
    jumpP  = keyPress('Numpad3')        || gpJustPressed(pad,2);
    punchH = keyHeld('Numpad1')         || gpHeld(pad,0);
    kickH  = keyHeld('Numpad2')         || gpHeld(pad,1);
    jumpH  = keyHeld('Numpad3')         || gpHeld(pad,2);
  }

  // ── Combo detection (priority: sp2 > sp1 > individual) ──────────
  // Special 2: all three — Jump held/pressed AND Punch+Kick overlap
  const sp2 = (jumpH || jumpP) &&
              ((punchP && kickH) || (kickP && punchH) || (punchP && kickP));
  // Special 1: Kick+Punch only (no jump intent)
  const sp1 = !sp2 &&
              ((punchP && kickH) || (kickP && punchH) || (punchP && kickP));

  // Suppress individual events consumed by a combo
  const rawPunchP = sp1||sp2 ? false : punchP;
  const rawKickP  = sp1||sp2 ? false : kickP;
  const rawJumpP  = sp2       ? false : jumpP;

  return {
    left: (keyboard===0?keyHeld('KeyA'):keyHeld('ArrowLeft')) || gpLeft,
    right:(keyboard===0?keyHeld('KeyD'):keyHeld('ArrowRight'))|| gpRight,
    up:   (keyboard===0?keyHeld('KeyW'):keyHeld('ArrowUp')) || gpUp,
    down: (keyboard===0?keyHeld('KeyS'):keyHeld('ArrowDown')) || gpDown,
    punchP: rawPunchP,
    kickP:  rawKickP,
    jumpP:  rawJumpP,
    spinP: !sp1&&!sp2&&((jumpP&&kickH)||(kickP&&jumpH)||(jumpP&&kickP)),
    special1P: sp1,
    special2P: sp2,
  };
}

// ─── MATH UTILS ────────────────────────────────────────────────────
const rnd  = (a, b) => a + Math.random() * (b - a);
const rndI = (a, b) => Math.floor(rnd(a, b + 1));
const clmp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t)   => a + (b - a) * t;

// ─── SCREEN FX ─────────────────────────────────────────────────────
let shakeAmt = 0, flashClr = null, flashA = 0;
const addShake = a  => { shakeAmt = Math.max(shakeAmt, a); };
const addFlash = (c, a) => { flashClr = c; flashA = a; };
function updateFX() { shakeAmt *= 0.74; flashA *= 0.80; }

// ─── PARTICLES ─────────────────────────────────────────────────────
const PARTS = [];
function spawnParts(x, y, clr, n = 8, sp = 5) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI*2), s = rnd(1, sp);
    PARTS.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2,
                 life: rndI(18,32), maxLife: 32, clr, r: rnd(2, 4.5) });
  }
}
function spawnBlood(x, y) { spawnParts(x, y-25, '#c00', 14, 6); spawnParts(x, y-10, '#f44', 6, 3); }
function spawnFeather(x, y) { spawnParts(x, y-30, '#88ccff', 12, 7); spawnParts(x, y-15, '#fff', 6, 4); }
function updateParts() {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const p = PARTS[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.life--;
    if (p.life <= 0) PARTS.splice(i, 1);
  }
}
function drawParts(camX) {
  PARTS.forEach(p => {
    ctx.save(); ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.clr;
    ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

// ─── FLOATING TEXT ─────────────────────────────────────────────────
const FTEXTS = [];
function spawnTxt(x, y, txt, clr = '#fff', size = 16) {
  FTEXTS.push({ x, y, txt, clr, size, life: 55, vy: -1.4 });
}
function updateFTexts() {
  for (let i = FTEXTS.length - 1; i >= 0; i--) {
    const t = FTEXTS[i]; t.y += t.vy; t.life--;
    if (t.life <= 0) FTEXTS.splice(i, 1);
  }
}
function drawFTexts(camX) {
  FTEXTS.forEach(t => {
    ctx.save(); ctx.globalAlpha = Math.min(1, t.life / 20);
    ctx.font = `bold ${t.size}px Courier New`;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.strokeText(t.txt, t.x - camX, t.y);
    ctx.fillStyle = t.clr; ctx.fillText(t.txt, t.x - camX, t.y);
    ctx.restore();
  });
}

// ─── CAMERA ─────────────────────────────────────────────────────────
const GAMEPLAY_ZOOM=1/.7;
const gameplayViewWidth=()=>W/GAMEPLAY_ZOOM;
// Scenery bounds are expanded only while drawing the gameplay world.
let sceneWidth=W,sceneTop=0,sceneBottom=H;
const cam = { x: 0, tx: 0, maxX: LEVEL_W - gameplayViewWidth() };

function updateCam(players, advLimit) {
  const active = players.filter(p => !p.inactive);
  let midX = active.length > 0 ? active.reduce((s, p) => s + p.x, 0) / active.length : W/2;
  // Don't let players drift too far apart (clamp spread to ~480px)
  if (active.length === 2) {
    const spread = Math.abs(active[0].x - active[1].x);
    if (spread > 480) {
      // nudge midpoint toward screen center (handled by player movement limit below)
    }
    midX = (active[0].x + active[1].x) / 2;
  }
  const viewW=gameplayViewWidth();
  const margin=GS.arena?Math.max(0,(viewW-(GS.arena.right-GS.arena.left))/2):0;
  const minCam=Math.min(LEVEL_W-viewW,Math.max(0,(GS.arena?.left||0)-margin));
  cam.tx = clmp(midX-viewW*.5,minCam,Math.max(minCam,Math.min(cam.maxX,advLimit+margin-viewW)));
  cam.x  = lerp(cam.x, cam.tx, 0.11);
}

// ── Kenshiro (P1) ───────────────────────────────────────────────────
// ════════════════════════════════════════════════════════════════════
//  CHARACTER DRAWING — Multi-frame animated canvas sprites
//  fr = quantised animation counter (steps of ANIM_STEP=20 at 3fps)
//  aF = Math.floor(fr/20) % numFrames  →  discrete frame index
// ════════════════════════════════════════════════════════════════════

// ── Shared helpers ───────────────────────────────────────────────────
function _shadow(rx,ry){ ctx.fillStyle='rgba(0,0,0,0.32)'; ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2); ctx.fill(); }

function _kenHead(by, angry) {
  // Face
  ctx.fillStyle='#c09060'; ctx.beginPath(); ctx.ellipse(0,-68+by,13,15,0,0,Math.PI*2); ctx.fill();
  // Hair block
  ctx.fillStyle='#111'; ctx.fillRect(-13,-83+by,26,18);
  // Spiky hair tufts
  [[-11,-83],[-5,-87],[2,-86],[9,-82]].forEach(([hx,hy])=>{
    ctx.beginPath(); ctx.moveTo(hx,hy+by); ctx.lineTo(hx+3,hy-8+by); ctx.lineTo(hx+7,hy+by); ctx.fill();
  });
  // Whites of eyes
  ctx.fillStyle='#fff'; ctx.fillRect(-8,-74+by,6,4); ctx.fillRect(2,-74+by,6,4);
  // Pupils — angry = narrow
  ctx.fillStyle='#111';
  if(angry){ ctx.fillRect(-6,-73+by,2,3); ctx.fillRect(4,-73+by,2,3); }
  else      { ctx.fillRect(-6,-73+by,4,3); ctx.fillRect(2,-73+by,4,3); }
  // Two vertical scars
  ctx.strokeStyle='#7a3020'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-4,-78+by); ctx.lineTo(-2,-70+by); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3,-78+by); ctx.lineTo(5,-70+by); ctx.stroke();
  // Mouth — grit teeth when angry
  if(angry){ ctx.strokeStyle='#6a3010'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(-4,-62+by); ctx.lineTo(4,-62+by); ctx.stroke(); }
}

function _kenTorso(by) {
  ctx.fillStyle='#1a3a8f'; ctx.fillRect(-15,-56+by,30,33);
  ctx.fillStyle='#122870'; ctx.fillRect(-15,-56+by,7,33); ctx.fillRect(8,-56+by,7,33);
  ctx.fillStyle='#0d1f5e'; // torn jacket edges
  ctx.beginPath(); ctx.moveTo(-15,-24+by); ctx.lineTo(-9,-30+by); ctx.lineTo(-5,-24+by); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15,-32+by); ctx.lineTo(11,-37+by); ctx.lineTo(6,-32+by); ctx.fill();
  // Big Dipper 7 stars
  ctx.fillStyle='#ffffffdd';
  [[-5,-48],[1,-46],[5,-42],[-1,-39],[1,-34],[5,-31],[8,-27]].forEach(([sx2,sy2])=>{
    ctx.beginPath(); ctx.arc(sx2,sy2+by,2.2,0,Math.PI*2); ctx.fill();
  });
  // Belt
  ctx.fillStyle='#8B5A00'; ctx.fillRect(-15,-24+by,30,6);
}

function _kenLeg(tx,ty,angle,len){ ctx.save(); ctx.translate(tx,ty); ctx.rotate(angle); ctx.fillStyle='#1e3d9a'; ctx.fillRect(-5,0,10,len); ctx.fillStyle='#111'; ctx.fillRect(-6,len-1,13,6); ctx.restore(); }

// ── Kenshiro ─────────────────────────────────────────────────────────
function drawKen(sx, y, dir, state, fr, invincible) {
  const SKIN='#c09060', DENIM='#1e3d9a', BOOT='#111', HAIR='#111';
  const step = aStep(state);
  const poseState=SPR['ken_'+state]?state:stateKey(state);
  if (tryDrawSpr('ken_' + poseState, sx, y, dir, invincible, fr, step)) return;
  if (invincible > 0 && Math.floor(invincible/5) % 2 === 1) return;
  ctx.save(); ctx.translate(sx, y);
  if (dir < 0) ctx.scale(-1, 1);

  const aF = Math.floor(fr / step);  // frame index with per-state timing
  _shadow(22, 6);

  if (state === 'idle') {
    // 6 frames guard-stance breathing cycle
    const f = aF % 6;
    const bobs  = [0,-1,-2,-3,-2,-1];
    const lA    = [0.05,0.07,0.08,0.05,-0.02,0][f];
    const rA    = [-0.05,-0.07,-0.08,-0.05,0.02,0][f];
    const by = -1.5+Math.cos(fr*.065)*1.5;
    _kenLeg(-7,-24,lA,26); _kenLeg(7,-24,rA,26);
    _kenTorso(by);
    const lArmY = [-53,-54,-55,-56,-55,-54][f];
    const rArmX = [14,13,13,12,13,14][f];
    ctx.fillStyle=SKIN; ctx.fillRect(-25,lArmY+by,11,9); ctx.fillRect(rArmX,-53+by,11,9);
    ctx.fillStyle='#9a7040'; ctx.fillRect(-27,lArmY+by-2,10,11); ctx.fillRect(rArmX+1,-55+by,10,11);
    _kenHead(by, false);

  } else if (state === 'walk') {
    // 6 frames full stride cycle
    const f = aF % 6;
    const phase=fr/(step*5)*Math.PI*2;
    const la=Math.cos(phase)*.43,ra=-la;
    const by=-(Math.sin(phase*2)**2)*2;
    _kenLeg(-7,-24,la,26); _kenLeg(7,-24,ra,26);
    _kenTorso(by);
    const aa = [-la*0.45,0,la*0.3,-la*0.45,0,la*0.3][f];
    ctx.save(); ctx.translate(-14,-52+by); ctx.rotate(-aa); ctx.fillStyle=SKIN; ctx.fillRect(-4,0,11,9); ctx.restore();
    ctx.save(); ctx.translate(14,-52+by);  ctx.rotate( aa); ctx.fillStyle=SKIN; ctx.fillRect(-7,0,11,9); ctx.restore();
    _kenHead(by, false);

  } else if (state === 'punch') {
    // 6 frames: guard → windup → half-extend → full-impact → follow-through → retract
    const f = aF % 6;
    const bys=[0,0,-2,-3,-2,-1][f];
    _kenLeg(-8,-24,-0.1,26); _kenLeg(8,-24,0.1,26);
    _kenTorso(bys);
    ctx.fillStyle=SKIN;
    if(f===0){
      ctx.fillRect(-24,-53+bys,11,9); ctx.fillRect(13,-53+bys,11,9);
      ctx.fillStyle='#9a7040'; ctx.fillRect(-27,-55+bys,10,11); ctx.fillRect(14,-55+bys,10,11);
    } else if(f===1){
      ctx.fillRect(-22,-54+bys,11,9); ctx.fillRect(-3,-51+bys,9,9);
      ctx.fillStyle='#9a7040'; ctx.fillRect(-25,-56+bys,10,11); ctx.fillRect(-5,-53+bys,10,11);
    } else if(f===2){
      ctx.fillRect(-24,-53+bys,11,9); ctx.fillRect(13,-52+bys,20,9);
      ctx.fillStyle='#9a7040'; ctx.fillRect(-27,-55+bys,10,11); ctx.fillRect(30,-54+bys,11,12);
      ctx.fillStyle='rgba(200,150,80,0.3)'; ctx.fillRect(13,-54+bys,22,12);
    } else if(f===3){
      ctx.fillRect(-24,-53+bys,11,9); ctx.fillRect(13,-52+bys,36,9);
      ctx.fillStyle='#9a7040'; ctx.fillRect(-27,-55+bys,10,11); ctx.fillRect(47,-56+bys,13,13);
      ctx.fillStyle='rgba(200,150,80,0.4)'; ctx.fillRect(13,-54+bys,38,12);
      ctx.fillStyle='rgba(255,230,80,0.85)'; ctx.beginPath(); ctx.arc(58,-52+bys,13,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(58,-52+bys,6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#ffcc00'; ctx.lineWidth=2;
      for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; ctx.beginPath(); ctx.moveTo(58+Math.cos(a)*8,-52+bys+Math.sin(a)*8); ctx.lineTo(58+Math.cos(a)*18,-52+bys+Math.sin(a)*18); ctx.stroke(); }
    } else if(f===4){
      ctx.fillRect(-24,-53+bys,11,9); ctx.fillRect(13,-52+bys,30,9);
      ctx.fillStyle='#9a7040'; ctx.fillRect(-27,-55+bys,10,11); ctx.fillRect(40,-55+bys,12,12);
    } else {
      ctx.fillRect(-24,-53+bys,11,9); ctx.fillRect(13,-52+bys,16,9);
      ctx.fillStyle='#9a7040'; ctx.fillRect(-27,-55+bys,10,11); ctx.fillRect(26,-55+bys,11,11);
    }
    _kenHead(bys, f>=2);

  } else if (state === 'kick') {
    // 6 frames jump kick: crouch-ready → lift-off → knee-chamber → full-extend → retract → land
    const f = aF % 6;
    if(f===0){
      _kenLeg(-7,-20,-0.15,22); _kenLeg(7,-20,0.2,22);
      _kenTorso(-2);
      ctx.fillStyle=SKIN; ctx.fillRect(-24,-50,11,9); ctx.fillRect(13,-50,11,9);
      _kenHead(-2,true);
    } else if(f===1){
      _kenLeg(-7,-22,-0.05,24); _kenLeg(7,-22,0.05,24);
      _kenTorso(-4);
      ctx.fillStyle=SKIN; ctx.fillRect(-26,-54,11,9); ctx.fillRect(13,-54,11,9);
      _kenHead(-4,true);
    } else if(f===2){
      _kenLeg(-7,-24,-0.08,26);
      ctx.save(); ctx.translate(8,-26); ctx.rotate(-0.75);
      ctx.fillStyle=DENIM; ctx.fillRect(-5,0,10,20); ctx.fillStyle=BOOT; ctx.fillRect(-6,19,13,6); ctx.restore();
      _kenTorso(-5);
      ctx.fillStyle=SKIN; ctx.fillRect(-28,-56,11,9); ctx.fillRect(14,-52,11,9);
      _kenHead(-5,true);
    } else if(f===3){
      _kenLeg(-7,-26,-0.08,26);
      ctx.save(); ctx.translate(8,-30); ctx.rotate(-1.42);
      ctx.fillStyle=DENIM; ctx.fillRect(-5,0,10,32); ctx.fillStyle=BOOT; ctx.fillRect(-6,31,13,7); ctx.restore();
      _kenTorso(-6);
      ctx.fillStyle=SKIN; ctx.fillRect(-30,-59,11,9); ctx.fillRect(14,-52,11,9);
      ctx.fillStyle='rgba(255,210,50,0.65)'; ctx.beginPath(); ctx.arc(30,-54,16,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,200,0.85)'; ctx.beginPath(); ctx.arc(30,-54,8,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#ffaa00'; ctx.lineWidth=2;
      for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; ctx.beginPath(); ctx.moveTo(30+Math.cos(a)*9,-54+Math.sin(a)*9); ctx.lineTo(30+Math.cos(a)*20,-54+Math.sin(a)*20); ctx.stroke(); }
      _kenHead(-6,true);
    } else if(f===4){
      ctx.save(); ctx.translate(8,-26); ctx.rotate(-0.7);
      ctx.fillStyle=DENIM; ctx.fillRect(-5,0,10,24); ctx.fillStyle=BOOT; ctx.fillRect(-6,23,13,6); ctx.restore();
      _kenLeg(-7,-24,-0.06,26);
      _kenTorso(-3);
      ctx.fillStyle=SKIN; ctx.fillRect(-26,-55,11,9); ctx.fillRect(13,-52,11,9);
      _kenHead(-3,true);
    } else {
      _kenLeg(-8,-22,-0.12,24); _kenLeg(8,-22,0.12,24);
      _kenTorso(-1);
      ctx.fillStyle=SKIN; ctx.fillRect(-24,-52,11,9); ctx.fillRect(13,-52,11,9);
      _kenHead(-1,false);
    }

  } else if (state === 'special') {
    // 6 frames JACKET BLOW-OFF: tense → rips → bursting → bare chest+stars → arms-spread energy → power stance
    const f = aF % 6;
    const by=[0,-2,-4,-5,-4,-2][f];
    _kenLeg(-10,-26,[-0.12,-0.15,-0.18,-0.2,-0.18,-0.12][f],28);
    _kenLeg( 10,-26,[ 0.12, 0.15, 0.18, 0.2, 0.18, 0.12][f],28);
    if(f<=2){
      _kenTorso(by);
      if(f>=1){
        ctx.strokeStyle='rgba(255,200,100,'+(f*0.35)+')'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(-8,-52+by); ctx.lineTo(-4,-38+by); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(5,-50+by); ctx.lineTo(2,-35+by); ctx.stroke();
      }
      if(f===2){
        ctx.fillStyle='rgba(30,60,150,0.7)';
        ctx.fillRect(-20,-60+by,8,6); ctx.fillRect(16,-55+by,7,5);
        ctx.strokeStyle='rgba(255,180,50,0.6)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(-12,-54+by); ctx.lineTo(-18,-62+by); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10,-52+by); ctx.lineTo(18,-60+by); ctx.stroke();
      }
    } else {
      ctx.fillStyle=SKIN;
      ctx.beginPath(); ctx.moveTo(-17,-58+by); ctx.lineTo(17,-58+by); ctx.lineTo(16,-22+by); ctx.lineTo(-16,-22+by); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#b07848';
      ctx.beginPath(); ctx.arc(-7,-44+by,8,0.2,Math.PI-0.2); ctx.fill();
      ctx.beginPath(); ctx.arc( 7,-44+by,8,0.2,Math.PI-0.2); ctx.fill();
      const sg=f===4?0.9:0.7;
      ctx.fillStyle='rgba(255,240,100,'+sg+')';
      [[-5,-54],[1,-52],[5,-48],[-1,-45],[1,-40],[5,-37],[8,-33]].forEach(([sx2,sy2])=>{
        ctx.beginPath(); ctx.arc(sx2,sy2+by,3,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(255,200,50,0.5)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(sx2,sy2+by,5,0,Math.PI*2); ctx.stroke();
      });
      ctx.fillStyle='#8B5A00'; ctx.fillRect(-16,-24+by,32,6);
    }
    if(f===4){
      ctx.fillStyle=SKIN; ctx.fillRect(-36,-55+by,13,9); ctx.fillRect(23,-55+by,13,9);
      ctx.fillStyle='rgba(100,180,255,0.7)'; ctx.beginPath(); ctx.arc(-36,-52+by,8,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(30,-52+by,8,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(150,220,255,0.8)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(-28,-62+by); ctx.lineTo(-36,-54+by); ctx.lineTo(-30,-50+by); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(28,-62+by); ctx.lineTo(36,-54+by); ctx.lineTo(30,-50+by); ctx.stroke();
      ctx.fillStyle='rgba(100,150,255,0.12)'; ctx.beginPath(); ctx.arc(0,-40+by,36,0,Math.PI*2); ctx.fill();
    } else if(f===5){
      ctx.fillStyle=SKIN; ctx.fillRect(-26,-55+by,12,9); ctx.fillRect(14,-55+by,12,9);
      ctx.fillStyle='#9a7040'; ctx.fillRect(-28,-57+by,11,12); ctx.fillRect(14,-57+by,11,12);
    } else if(f<3){
      ctx.fillStyle=SKIN; ctx.fillRect(-24,-53+by,11,9); ctx.fillRect(13,-53+by,11,9);
    }
    _kenHead(by, f>=2);

  } else if (state === 'jump') {
    // 6 frames: crouch → push-off → ascend-tuck → peak → descend → land-absorb
    const f = aF % 6;
    const by = [0,-4,-8,-12,-8,-3][f];
    const lA = [-0.15,-0.5,-0.6,-0.55,-0.3,-0.15][f];
    const rA = [ 0.15, 0.4, 0.5, 0.45, 0.25, 0.12][f];
    ctx.save(); ctx.translate(-7,-20+by); ctx.rotate(lA);

    ctx.save(); ctx.translate(7,-20+by); ctx.rotate(rA);
    ctx.fillStyle=DENIM; ctx.fillRect(-5,0,10,22); ctx.fillStyle=BOOT; ctx.fillRect(-6,21,13,5); ctx.restore();

    ctx.fillStyle=SKIN; ctx.fillRect(-armX-11,-53+by,11,9); ctx.fillRect(armX,-53+by,11,9);

    _kenTorso(0);

}

// ── Rei (P2) — Nanto Suichōken ──────────────────────────────────────
function _reiHead(by, expr) {
  ctx.fillStyle='#c8b890'; ctx.beginPath(); ctx.ellipse(0,-66+by,12,14,0,0,Math.PI*2); ctx.fill();
  // Long flowing blue hair
  ctx.fillStyle='#1a3ab8';
  ctx.fillRect(-11,-80+by,22,17);
  // Hair flowing behind dramatically
  ctx.beginPath();
  ctx.moveTo(-11,-76+by); ctx.quadraticCurveTo(-26,-64+by,-24,-48+by);
  ctx.lineTo(-17,-48+by); ctx.quadraticCurveTo(-19,-64+by,-8,-75+by); ctx.fill();
  // Front bang
  ctx.beginPath(); ctx.moveTo(-11,-80+by); ctx.lineTo(-15,-88+by); ctx.lineTo(-4,-80+by); ctx.fill();
  // Side locks
  ctx.beginPath(); ctx.moveTo(9,-80+by); ctx.lineTo(13,-87+by); ctx.lineTo(11,-80+by); ctx.fill();
  // Eyes
  ctx.fillStyle='#fff'; ctx.fillRect(-6,-71+by,5,3); ctx.fillRect(1,-71+by,5,3);
  ctx.fillStyle='#224'; ctx.fillRect(-5,-70+by,3,3); ctx.fillRect(2,-70+by,3,3);
  if(expr==='fierce'){ ctx.strokeStyle='#334'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(-6,-74+by); ctx.lineTo(-2,-73+by); ctx.stroke(); ctx.beginPath(); ctx.moveTo(1,-74+by); ctx.lineTo(5,-73+by); ctx.stroke(); }
  ctx.strokeStyle='#8a6a50'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-3,-61+by); ctx.lineTo(3,-61+by); ctx.stroke();
}

function _reiTorso(by) {
  ctx.fillStyle='#e8f0ff'; ctx.fillRect(-13,-54+by,26,32);
  ctx.fillStyle='#5577cc'; ctx.fillRect(-13,-54+by,5,32); ctx.fillRect(8,-54+by,5,32);
  ctx.fillRect(-13,-54+by,26,4); // top trim
  // Nanto 6-star bird emblem on chest
  ctx.fillStyle='#6688ff';
  for(let i=0;i<6;i++){ const a=i/6*Math.PI*2-Math.PI/2; ctx.beginPath(); ctx.arc(Math.cos(a)*7,(-42+by)+Math.sin(a)*7,2,0,Math.PI*2); ctx.fill(); }
  ctx.beginPath(); ctx.arc(0,-42+by,2.5,0,Math.PI*2); ctx.fill();
  // Sash belt
  ctx.fillStyle='#3355aa'; ctx.fillRect(-13,-24+by,26,6);
}

function drawRei(sx, y, dir, state, fr, invincible) {
  const poseState = SPR['rei_'+state] ? state : stateKey(state);
  if (tryDrawSpr('rei_' + poseState, sx, y, dir, invincible, fr, aStep(state))) return;
  if (invincible > 0 && Math.floor(invincible/5) % 2 === 1) return;
  ctx.save(); ctx.translate(sx, y);
  if (dir < 0) ctx.scale(-1, 1);

  const aF = Math.floor(fr / aStep(state));
  _shadow(20, 5);

  function reiLeg(tx,ty,angle,len){
    ctx.save(); ctx.translate(tx,ty); ctx.rotate(angle);
    ctx.fillStyle='#dde8ff'; ctx.fillRect(-4,0,9,len);
    ctx.fillStyle='#6677aa'; ctx.fillRect(-5,len-1,11,5); ctx.restore();
  }

  if (state === 'idle') {
    const f=aF%2, by=f===0?0:-2;
    // Elegant crane stance — weight on back foot
    reiLeg(-6,-22,f===0?0.12:0.06,24); reiLeg(6,-22,f===0?-0.12:-0.06,24);
    _reiTorso(by);
    ctx.fillStyle='#c8b890'; ctx.fillRect(-22,-50+by,11,8); ctx.fillRect(11,-50+by,11,8);
    _reiHead(by,'calm');

  } else if (state === 'walk') {
    const f=aF%4;
    const la=[0.4,0.08,-0.4,-0.08][f], ra=[-0.4,-0.08,0.4,0.08][f];
    const by=[0,-2,0,-2][f];
    reiLeg(-6,-22,la,24); reiLeg(6,-22,ra,24);
    _reiTorso(by);
    // Graceful arm movement — one arm extended forward, crane-style
    const aa=[-la*0.4,0,la*0.4,0][f];
    ctx.save(); ctx.translate(-13,-50+by); ctx.rotate(-aa); ctx.fillStyle='#c8b890'; ctx.fillRect(-4,0,10,8); ctx.restore();
    ctx.save(); ctx.translate(13,-50+by);  ctx.rotate( aa); ctx.fillStyle='#c8b890'; ctx.fillRect(-6,0,10,8); ctx.restore();
    _reiHead(by,'calm');

  } else if (state === 'punch') {
    // Nanto Suichōken SLASH — fingertip strikes, not fists
    const f=aF%3;
    const by=[0,-3,-2][f];
    reiLeg(-6,-22,0.1,24); reiLeg(6,-22,-0.1,24);
    _reiTorso(by);
    ctx.fillStyle='#c8b890';
    if(f===0){
      // COIL — both arms drawn in, body twisting
      ctx.fillRect(-20,-52+by,10,8); ctx.fillRect(-2,-50+by,9,8);
    } else if(f===1){
      // SLASH FORWARD — right arm extending in blade strike
      ctx.fillRect(-22,-52+by,10,8);
      ctx.fillRect(11,-49+by,30,8); // arm extended
      // Finger blade tips (Nanto)
      ctx.fillStyle='#aaccff';
      for(let i=0;i<4;i++) ctx.fillRect(39+i*3,-53+by,2,10);
      ctx.fillStyle='rgba(150,200,255,0.5)'; ctx.fillRect(11,-54+by,32,14);
    } else {
      // FULL SLASH — arm fully extended, energy slash effect
      ctx.fillRect(-22,-52+by,10,8);
      ctx.fillRect(11,-49+by,36,8);
      ctx.fillStyle='#88ccff';
      for(let i=0;i<4;i++) ctx.fillRect(45+i*3,-54+by,2,12);
      // Slash energy arc
      ctx.strokeStyle='rgba(100,180,255,0.8)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(50,-47+by,15,-0.6,0.6); ctx.stroke();
      ctx.strokeStyle='rgba(200,230,255,0.6)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(50,-47+by,20,-0.5,0.5); ctx.stroke();
    }
    _reiHead(by,'fierce');

  } else if (state === 'kick') {
    const f=aF%3;
    reiLeg(-6,-22,-0.08,24);
    if(f===0){
      // Crane kick CHAMBER — knee high, elegant
      ctx.save(); ctx.translate(6,-24); ctx.rotate(-0.7);
      ctx.fillStyle='#dde8ff'; ctx.fillRect(-4,0,9,18); ctx.fillStyle='#6677aa'; ctx.fillRect(-5,17,11,5); ctx.restore();
      _reiTorso(0);
      ctx.fillStyle='#c8b890'; ctx.fillRect(-22,-50,10,8); ctx.fillRect(11,-50,10,8);
      _reiHead(0,'fierce');
    } else if(f===1){
      // CRANE KICK — straight leg full extension, very high
      ctx.save(); ctx.translate(6,-26); ctx.rotate(-1.45);
      ctx.fillStyle='#dde8ff'; ctx.fillRect(-4,0,9,30); ctx.fillStyle='#6677aa'; ctx.fillRect(-5,29,11,6); ctx.restore();
      _reiTorso(-5);
      // Arms spread wide for balance
      ctx.fillStyle='#c8b890'; ctx.fillRect(-28,-52,10,8); ctx.fillRect(14,-52,10,8);
      // Energy burst at kick point
      ctx.fillStyle='rgba(100,180,255,0.6)'; ctx.beginPath(); ctx.arc(26,-56,14,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#88ccff'; ctx.lineWidth=2;
      for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; ctx.beginPath(); ctx.moveTo(26+Math.cos(a)*7,-56+Math.sin(a)*7); ctx.lineTo(26+Math.cos(a)*18,-56+Math.sin(a)*18); ctx.stroke(); }
      _reiHead(-5,'fierce');
    } else {
      ctx.save(); ctx.translate(6,-22); ctx.rotate(-0.2);
      ctx.fillStyle='#dde8ff'; ctx.fillRect(-4,0,9,22); ctx.fillStyle='#6677aa'; ctx.fillRect(-5,21,11,5); ctx.restore();
      _reiTorso(-1);
      ctx.fillStyle='#c8b890'; ctx.fillRect(-22,-50,10,8); ctx.fillRect(11,-50,10,8);
      _reiHead(-1,'calm');
    }

  } else if (state === 'special') {
    // SUICHŌ ZAN — Nanto Haja Ken storm, 4 frames
    const f=aF%4;
    const by=[0,-5,-3,-6][f];
    reiLeg(-8,-24,-0.2,26); reiLeg(8,-24,0.2,26);
    _reiTorso(by);
    // Rapid slash arms — different angles each frame
    ctx.fillStyle='#c8b890';
    const slashFrames=[
      {lx:-22,ly:-53,lw:10,rx:11,ry:-49,rw:32},
      {lx:11,ly:-53,lw:28,rx:-22,ry:-49,rw:10},
      {lx:-26,ly:-57,lw:10,rx:11,ry:-50,rw:24},
      {lx:11,ly:-57,lw:24,rx:-26,ry:-50,rw:10},
    ][f];
    ctx.fillRect(slashFrames.lx,slashFrames.ly+by,slashFrames.lw,8);
    ctx.fillRect(slashFrames.rx,slashFrames.ry+by,slashFrames.rw,8);
    // Finger blades
    ctx.fillStyle='#aaddff';
    for(let i=0;i<4;i++){
      ctx.fillRect(slashFrames.rx+slashFrames.rw+i*3-2,slashFrames.ry+by-4,2,11);
    }
    // Cross-slash energy lines
    ctx.strokeStyle=`rgba(100,200,255,${0.5+f*0.1})`; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(-30,-65+by); ctx.lineTo(40,-40+by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-20,-40+by); ctx.lineTo(50,-68+by); ctx.stroke();
    if(f%2===0){
      ctx.fillStyle='#88ddff'; ctx.font='bold 11px "Arial Black",sans-serif';
      ctx.fillText('NANTO!',10,-72+by);
    }
    _reiHead(by,'fierce');

  } else if (state === 'jump') {
    const f=aF%2, by=f===0?-11:-5;
    ctx.save(); ctx.translate(-6,-20+by); ctx.rotate(-0.5);
    ctx.fillStyle='#dde8ff'; ctx.fillRect(-4,0,9,18); ctx.fillStyle='#6677aa'; ctx.fillRect(-5,17,11,5); ctx.restore();
    ctx.save(); ctx.translate(6,-20+by); ctx.rotate(0.35);
    ctx.fillStyle='#dde8ff'; ctx.fillRect(-4,0,9,18); ctx.fillStyle='#6677aa'; ctx.fillRect(-5,17,11,5); ctx.restore();
    _reiTorso(by);
    ctx.fillStyle='#c8b890'; ctx.fillRect(-22,-50+by,10,8); ctx.fillRect(11,-50+by,10,8);
    _reiHead(by,'calm');

  } else {
    reiLeg(-6,-22,0,24); reiLeg(6,-22,0,24);
    _reiTorso(0);
    ctx.fillStyle='#c8b890'; ctx.fillRect(-22,-50,10,8); ctx.fillRect(11,-50,10,8);
    _reiHead(0,'calm');
  }
  ctx.restore();
}

// ── Toki (P1/P2 selectable) — Hokuto Shinken · gentle fist ─────────
function _tokiHead(by, expr) {

function _tokiRobe(by) {
  // Wide flowing robe
  ctx.fillStyle='#eef4ff';
  ctx.beginPath();
  ctx.moveTo(-20,-58+by); ctx.lineTo(-17,-60+by); ctx.lineTo(17,-60+by); ctx.lineTo(20,-58+by);
  ctx.lineTo(18,-22+by); ctx.lineTo(-18,-22+by); ctx.closePath(); ctx.fill();

  ctx.beginPath(); ctx.moveTo(0,-60+by); ctx.lineTo(-8,-57+by); ctx.lineTo(-5,-24+by); ctx.lineTo(0,-24+by); ctx.fill();

function drawToki(sx, y, dir, state, fr, invincible) {

  } else if (state === 'punch') {

    } else {
      // FULL REACH — finger at vital point, energy burst

      ctx.fillRect(11,-52+by,34,9);

      for(let i=0;i<5;i++){ const a=i/5*Math.PI*2; ctx.beginPath(); ctx.moveTo(24+Math.cos(a)*6,-52+Math.sin(a)*6); ctx.lineTo(24+Math.cos(a)*16,-52+Math.sin(a)*16); ctx.stroke(); }

      ctx.fillStyle='#d0c0a0'; ctx.fillRect(-22,-52,11,9); ctx.fillRect(11,-52,11,9);

// ── Generic Enemy ───────────────────────────────────────────────────
function drawEnemy(sx, y, dir, state, fr, def, hp, maxHp, proceduralOnly=false) {
  const eKey = 'enemy_' + stateKey(state);
  if (!proceduralOnly && tryDrawSpr(eKey, sx, y, dir, 0, fr)) return;
  if (!proceduralOnly && eKey !== 'enemy_idle' && tryDrawSpr('enemy_idle', sx, y, dir, 0, fr)) return;
  ctx.save();
  ctx.translate(sx, y);
  if (dir < 0) ctx.scale(-1, 1);

  const aF = Math.floor(fr / aStep(state));
  const sc  = def.scale || 1;
  ctx.scale(sc, sc);
  if (state === 'stunned') {
    // Stunned: reeling/wobbling back
    const wobble = [0.18,-0.18,0.12,-0.12][aF%4];
    ctx.rotate(wobble);
    ctx.translate(0, [-2,2,-1,1][aF%4]);
  }

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 0, 16, 4, 0, 0, Math.PI*2); ctx.fill();

  function eLeg(tx,ty,ang,len){
    ctx.save(); ctx.translate(tx,ty); ctx.rotate(ang);
    ctx.fillStyle=def.legClr; ctx.fillRect(-5,0,10,len);
    ctx.fillStyle='#222'; ctx.fillRect(-6,len-1,13,5); ctx.restore();
  }

  if (state === 'walk') {
    // 4-frame walk — clear stride
    const f=aF%4;
    const la=[0.38,0.07,-0.38,-0.07][f], ra=[-0.38,-0.07,0.38,0.07][f];
    const by=[0,-2,0,-2][f];
    eLeg(-7,-20,la,22); eLeg(7,-20,ra,22);
    ctx.fillStyle=def.torsoClr; ctx.fillRect(-13,-50,26,32);
    if(def.stripe){ ctx.fillStyle=def.stripe; ctx.fillRect(-13,-50,5,32); ctx.fillRect(8,-50,5,32); }
    // Arms swing with stride
    const aa=[-la*0.4,0,la*0.4,0][f];
    ctx.fillStyle=def.skinClr;
    ctx.save(); ctx.translate(-13,-48+by); ctx.rotate(-aa); ctx.fillRect(-4,0,10,9); ctx.restore();
    ctx.save(); ctx.translate(13,-48+by);  ctx.rotate( aa); ctx.fillRect(-6,0,10,9); ctx.restore();
    // Head
    ctx.fillStyle=def.skinClr; ctx.beginPath(); ctx.ellipse(0,-62+by,12,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=def.hairClr;
    if(def.mohawk){ ctx.fillRect(-3,-75+by,6,14); } else { ctx.fillRect(-11,-74+by,22,14); }
    ctx.fillStyle='#c00'; ctx.fillRect(-5,-65+by,3,2); ctx.fillRect(2,-65+by,3,2);

  } else if (state === 'attack') {
    // 3-frame attack: RAISE fist, SWING forward, RECOVER
    const f=aF%3;
    eLeg(-7,-20,-0.15,22); eLeg(7,-20,0.15,22);
    ctx.fillStyle=def.torsoClr; ctx.fillRect(-13,-50,26,32);
    if(def.stripe){ ctx.fillStyle=def.stripe; ctx.fillRect(-13,-50,5,32); ctx.fillRect(8,-50,5,32); }
    ctx.fillStyle=def.skinClr;
    if(f===0){
      // RAISING fist — arm cocked way back, body leaning
      ctx.fillRect(-18,-52,10,9);    // left arm forward for balance
      ctx.fillRect(-4,-56,10,9);     // right arm coiling up
      ctx.fillStyle='#666'; ctx.fillRect(-6,-58,10,9); // knuckle guard
    } else if(f===1){
      // SWINGING — right arm lunging forward aggressively
      ctx.fillRect(-22,-48,10,9);
      ctx.fillRect(13,-47,26,10);    // arm lunging
      ctx.fillStyle='#666'; ctx.fillRect(36,-50,11,13); // fist
      // aggression flash
      ctx.fillStyle='rgba(255,100,50,0.5)'; ctx.beginPath(); ctx.arc(46,-46,10,0,Math.PI*2); ctx.fill();
    } else {
      // RECOVER — arm pulling back
      ctx.fillRect(-20,-48,10,9); ctx.fillRect(8,-48,18,9);
    }
    // Head
    ctx.fillStyle=def.skinClr; ctx.beginPath(); ctx.ellipse(0,-62,12,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=def.hairClr;
    if(def.mohawk){ ctx.fillRect(-3,-75,6,14); } else { ctx.fillRect(-11,-74,22,14); }
    ctx.fillStyle='#c00'; ctx.fillRect(-5,-65,3,2); ctx.fillRect(2,-65,3,2);
    // Angry brow line
    ctx.strokeStyle='#800'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-6,-68); ctx.lineTo(-2,-66); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2,-68); ctx.lineTo(6,-66); ctx.stroke();

  } else {
    // idle / approach — 2 frame menacing stance
    const f=aF%2, by=f===0?0:-1;
    eLeg(-7,-20,f===0?0.05:-0.05,22); eLeg(7,-20,f===0?-0.05:0.05,22);
    ctx.fillStyle=def.torsoClr; ctx.fillRect(-13,-50,26,32);
    if(def.stripe){ ctx.fillStyle=def.stripe; ctx.fillRect(-13,-50,5,32); ctx.fillRect(8,-50,5,32); }
    ctx.fillStyle=def.skinClr;
    ctx.fillRect(-22,-49+by,11,9); ctx.fillRect(11,-49+by,11,9); // arms at sides
    // Head
    ctx.fillStyle=def.skinClr; ctx.beginPath(); ctx.ellipse(0,-62+by,12,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=def.hairClr;
    if(def.mohawk){ ctx.fillRect(-3,-75+by,6,14); } else { ctx.fillRect(-11,-74+by,22,14); }
    ctx.fillStyle='#c00'; ctx.fillRect(-5,-65+by,3,2); ctx.fillRect(2,-65+by,3,2);
  }

  if (hp < maxHp) {
    ctx.fillStyle='#500'; ctx.fillRect(-16,-84,32,5);
    ctx.fillStyle='#f22'; ctx.fillRect(-16,-84,32*(hp/maxHp),5);
    ctx.strokeStyle='#300'; ctx.lineWidth=0.5;
    ctx.strokeRect(-16,-84,32,5);
  }
  ctx.restore();
}

// Cached, half-resolution scenery gives the hard edges of arcade background art.
// Each transparent plane scrolls independently; no flattened image hides layers.
// Painted scenery uses independent panorama, road, roadside and near-debris planes.
const COMIC_ART = {};
function loadComicScenery() {
  for (const [key,file] of Object.entries({wasteland:'wasteland-comic.png',village:'settlement-comic.png',props:'wreckage-comic.png'})) {
    const img=new Image();
    img.onload=()=>{ COMIC_ART[key]=img; };
    img.onerror=()=>console.warn('Using canvas scenery until artwork is available:',file);
    img.src='assets/backgrounds/'+file;
  }
}
// Reflect alternate tiles so arbitrary painted edges join without a hard seam.
function drawComicStrip(img,sourceY,sourceH,y,height,camX,speed,period) {
  const scroll=camX*speed, first=Math.floor(scroll/period);
  for(let tile=first;tile*period-scroll<sceneWidth;tile++) {
    const x=tile*period-scroll;
    ctx.save();ctx.translate(x,y);
    if(Math.abs(tile%2)===1){ctx.translate(period,0);ctx.scale(-1,1);}
    ctx.drawImage(img,0,sourceY,img.naturalWidth,sourceH,0,0,period,height);
    ctx.restore();
  }
}
const COMIC_PROP_REGIONS = [
  [16,202,532,234], [563,68,415,380], [1025,184,493,273],
  [15,634,480,316], [539,632,450,302], [1038,690,485,242],
];
function drawComicProp(index,x,bottom,width,flip=false) {
  const img=COMIC_ART.props;if(!img)return;
  const [sx,sy,sw,sh]=COMIC_PROP_REGIONS[index];
  ctx.save();ctx.translate(x,bottom);
  if(flip)ctx.scale(-1,1);
  ctx.drawImage(img,sx,sy,sw,sh,-width/2,-width*sh/sw,width,width*sh/sw);
  ctx.restore();
}
// All scenery resting on the road shares the scroll speed at its contact depth.
function groundScrollSpeed(y) {
  const laneBack=LANE_BACK-10,laneFront=LANE_FRONT+10;
  if(y<laneBack)return lerp(.22,1,clmp((y-450)/(laneBack-450),0,1));
  if(y<=laneFront)return 1;

function drawComicRoadside(camX,village) {

    for(const [index,px,width] of [[0,350,275],[1,1080,118],[2,1750,205],[5,2280,155]]) {

function drawComicBackground(camX,village) {
  const img=COMIC_ART[village?'village':'wasteland'];if(!img)return false;
  ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  // Natural panorama proportions: buildings sit behind the expanded fighting ground.
  const scale=586/img.naturalHeight,period=img.naturalWidth*scale;
  const skyTop=Math.min(0,sceneTop);
  drawComicStrip(img,0,img.naturalHeight,skyTop,586-skyTop,camX,.22,period);

  // A soft upper edge blends into the distant road without a horizontal cut.
  const top=450,bottom=720,sourceTop=img.naturalHeight*.79;
  for(let y=top;y<Math.max(bottom,sceneBottom);y+=2) {
    const depth=Math.min(1,(y-top)/(bottom-top)),sy=sourceTop+depth*(img.naturalHeight-sourceTop-2);
    ctx.globalAlpha=Math.min(1,(y-top)/28);
    drawComicStrip(img,sy,2,y,2,camX,groundScrollSpeed(y),period*(.88+depth*.34));
  }
  ctx.globalAlpha=1;
  drawComicRoadside(camX,village);
  // Thin moving dust veils: transparent, low-contrast and below the characters.
  const time=performance.now()*.012;
  for(let i=0;i<5;i++) {
    const x=((i*347-camX*.48+time)%(sceneWidth+440)+sceneWidth+440)%(sceneWidth+440)-220;
    const y=456+(i%3)*18;
    const haze=ctx.createRadialGradient(x,y,0,x,y,150);
    haze.addColorStop(0,village?'rgba(156,151,173,.045)':'rgba(237,198,142,.07)');
    haze.addColorStop(1,'rgba(180,145,100,0)');
    ctx.fillStyle=haze;ctx.fillRect(x-150,y-35,300,70);
  }

}
function drawComicForeground(camX,village) {

  ctx.save();ctx.imageSmoothingEnabled=true;

const SCENERY = {};

function sceneryRandom(seed) {
  return () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
}
function buildScenery(village) {
  const width=1024, height=360, layers={};

    sky:['#101924','#354451','#b58c73'], haze:'#c79c78', mountain:'#59636a', ridge:'#737877',
    far:'#38484e', face:'#4c4943', side:'#292e31', light:'#8f7d61', soil:['#70634f','#342f2d']
  } : {
    sky:['#242333','#85534d','#e9ac70'], haze:'#e4b084', mountain:'#987b77', ridge:'#ba9280',
    far:'#655c60', face:'#786657', side:'#413e40', light:'#c79e71', soil:['#b28d60','#514334']

    const c=document.createElement('canvas'); c.width=width; c.height=height;

    g.fillStyle=color; g.beginPath(); points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); g.closePath(); g.fill();
  }
  plane('sky',g=>{
    const grad=g.createLinearGradient(0,0,0,210);
    palette.sky.forEach((c,i)=>grad.addColorStop(i/2,c)); g.fillStyle=grad;g.fillRect(0,0,width,height);
    g.fillStyle=village?'#e4d8b4':'#f8d398';g.beginPath();g.arc(330,86,village?16:30,0,Math.PI*2);g.fill();
    const rand=sceneryRandom(40);
    for(let i=0;i<55;i++) {
      const x=rand()*width,y=25+rand()*112,w=30+rand()*125;
      g.fillStyle=i%2?'#443b4930':'#e6b38b20';g.fillRect(x,y,w,2+rand()*5);
    }
  });
  plane('mountains',g=>{
    const rand=sceneryRandom(82);const points=[[0,207],[0,163]];
    for(let x=0;x<=width;x+=32) points.push([x,x===0||x===width?163:115+rand()*67]);
    points.push([width,207]);poly(g,points,palette.mountain);
    for(let i=2;i<points.length-2;i++) {

    }
    g.fillStyle=palette.haze+'40';g.fillRect(0,186,width,25);
  });
  plane('skyline',g=>{
    const rand=sceneryRandom(village?115:97);
    for(let x=12;x<width-40;x+=27+rand()*32) {
      const w=16+rand()*29,h=23+rand()*66,y=211-h;
      g.fillStyle=palette.far;g.fillRect(x,y,w,h);
      poly(g,[[x,y],[x+3,y-7],[x+w*.48,y-3],[x+w*.62,y+5],[x+w,y],[x+w,y+12],[x,y+12]],palette.far);
      g.fillStyle=palette.ridge+'50';g.fillRect(x,y+7,2,h-7);
      for(let yy=y+12;yy<201;yy+=10) for(let xx=x+5;xx<x+w-4;xx+=7) {
        g.fillStyle=rand()>.89?'#d0a06b':'#252e384d';g.fillRect(xx,yy,3,5);
      }
      if(rand()>.7){g.fillStyle=palette.far;g.fillRect(x+w/2,y-19,2,19);}
    }
    g.fillStyle=palette.haze+'22';g.fillRect(0,191,width,24);
  });
  plane('ruins',g=>{
    const rand=sceneryRandom(village?305:204);
    for(let n=0;n<7;n++) {
      const x=25+n*146,w=45+rand()*37,h=35+rand()*(village?70:44),y=223-h;
      // Broken roofline, shaded wall return, masonry courses and empty windows.
      poly(g,[[x,223],[x,y],[x+w*.3,y+3],[x+w*.42,y-9],[x+w*.55,y+5],[x+w,y+9],[x+w,223]],palette.face);
      poly(g,[[x+w,y+9],[x+w+13,y+18],[x+w+13,223],[x+w,223]],palette.side);
      g.fillStyle=palette.light;g.fillRect(x,y+5,2,218-y);
      for(let yy=y+15;yy<220;yy+=9) {
        g.fillStyle=palette.side+'70';g.fillRect(x+2,yy,w-3,1);
        for(let xx=x+6+(Math.floor(yy/9)%2)*8;xx<x+w-3;xx+=16)g.fillRect(xx,yy-8,1,8);

function drawArcadeGround(camX,palette,village) {

  grad.addColorStop(0,palette.soil[0]);grad.addColorStop(1,palette.soil[1]);
  ctx.fillStyle=grad;ctx.fillRect(0,horizon,sceneWidth,sceneBottom-horizon);

    ctx.strokeStyle=depth<.3?'#332e2926':'#211f244a';ctx.lineWidth=1+depth;

      const xx=x+(row%2)*spacing*.46;

      if(village){ctx.lineTo(xx+spacing*.57,y+8+depth*10);}else{ctx.lineTo(xx+spacing*.35,y+5+depth*6);}

}
function drawArcadeBackground(camX,village) {

function updateReiMove(p,inp,minX,maxX){
 const c=REI_MOVES,axis=inp.right?1:inp.left?-1:0;
 p.forwardTapT=Math.max(0,(p.forwardTapT||0)-1);
 const tap=axis&&axis!==p.lastMoveAxis;p.lastMoveAxis=axis;

  if(m.kind==='net'){
   if(m.t>c.netStartup&&m.t<=c.netStartup+c.netTravel){
    const reach=reiNetReach(m);
    for(const e of [...GS.enemies,...(GS.boss?[GS.boss]:[])]){
     const dx=(e.x-m.x)*m.dir;
     if(m.hits.has(e)||!canReceiveHit(e)||dx<0||dx>reach||Math.abs(e.y-m.y)>c.netLane)continue;

     m.hits.add(prop);prop.hp-=c.netDamage;
     if(prop.hp<=0)breakSupply(prop);

   }
   if(m.t>=c.netTicks){p.reiMove=null;setFighterState(p,'idle');}
  }else{
   const diveStart=c.birdRise+c.birdHover,land=diveStart+c.birdDive;
   if(m.t<=c.birdRise){const t=m.t/c.birdRise;p.z=c.birdHeight*(1-(1-t)*(1-t));p.vz=2*c.birdHeight/c.birdRise*(1-t);}
   else if(m.t<=diveStart){p.z=c.birdHeight;p.vz=0;}
   else if(m.t<=land){
    const t=(m.t-diveStart)/c.birdDive,ease=t*t;
    p.x=clmp(m.x+(m.targetX-m.x)*ease,minX,maxX);p.y=m.y+(m.targetY-m.y)*ease;

   }
   if(m.t===land){

    for(const e of [...GS.enemies,...(GS.boss?[GS.boss]:[])]){
     if(!canReceiveHit(e)||Math.abs(e.x-p.x)>90||Math.abs(e.y-p.y)>55)continue;
     m.hits.add(e);if(e===GS.boss)hitBoss(p,e,c.birdDamage);else hitEnemy(p,e,c.birdDamage,'#edffff',true);

   if(m.t>=c.birdTicks){p.reiMove=null;p.z=0;p.vz=0;p.onGround=true;setFighterState(p,'idle');}
  }

 }
 const free=p.onGround&&!p.attack&&!p.specialActive&&!p.stun&&!p.downT&&!p.riseT&&!p.landT;
 if(!free){p.forwardTapT=0;return false;}
 if((inp.spinP||(inp.jumpP&&inp.kickP&&!inp.special2P))&&p.special>=c.birdCost){
  const targets=[...GS.enemies,...(GS.boss?[GS.boss]:[])].filter(e=>canReceiveHit(e)&&(e.x-p.x)*p.dir>=0&&(e.x-p.x)*p.dir<=c.birdRange&&Math.abs(e.y-p.y)<=60).sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x));
  const target=targets[0];
  p.special-=c.birdCost;p.reiMove={kind:'bird',t:0,x:p.x,y:p.y,dir:p.dir,hits:new Set(),targetX:clmp(target?target.x:p.x+p.dir*240,minX,maxX),targetY:target?target.y:p.y};
  p.onGround=false;p.z=1;p.vx=0;p.vz=20;p.buffer=null;p.forwardTapT=0;p.state='special';p.fr=0;sndSpecialRei();return true;
 }
 if(tap&&axis===p.dir){
  if(p.forwardTapT>0&&p.forwardTapDir===axis){
   p.reiMove={kind:'net',t:0,x:p.x,y:p.y,dir:p.dir,hits:new Set()};p.forwardTapT=0;p.buffer=null;p.vx=0;p.moveX=0;p.moveY=0;p.state='special';p.fr=0;sndSpecialRei();return true;

function updatePlayer(p,pIdx,inp,camX,advLimit) {
  if(p.inactive)return;
  p.fr++;p.motionFr=(p.motionFr||0)+1;p.landingVisual=Math.max(0,(p.landingVisual||0)-1);
  const motion=motionFor(p);
  const walking=p.onGround&&!p.kenMove&&!p.reiMove&&!p.attack&&!p.specialActive&&!p.stun&&!p.downT&&!p.riseT&&!p.landT&&(inp.left||inp.right||inp.up||inp.down);
  p.walkBlend=approachSpeed(p.walkBlend||0,walking?1:0,.16);
  if(p.attack||p.specialActive||p.stun||p.downT||p.riseT||p.landT){p.moveX=0;p.moveY=0;}
  p.invincible=Math.max(0,p.invincible-1);
  p.comboT=Math.max(0,p.comboT-1);if(!p.comboT)p.comboN=0;
  if(p.buffer && --p.buffer.ttl<=0)p.buffer=null;
  const minX=Math.max(camX+22,(GS.arena?.left||0)+22);
  const right=Math.max(minX,Math.min(advLimit-30,LEVEL_W-30));
  if(p.charIdx===0&&updateKenMove(p,inp,minX,right))return;
  if(p.charIdx===1&&updateReiMove(p,inp,minX,right))return;
  tickAir(p,minX,right);
  if(p.downT>0) {
    setFighterState(p,'knockdown');if(p.onGround)p.x=clmp(p.x+p.vx,camX+22,right);p.vx*=.82;
    if(p.onGround && --p.downT<=0){p.riseT=COMBAT.rise;setFighterState(p,'getup');}
    return;
  }
  if(p.riseT>0) {
    if(--p.riseT<=0){p.invincible=Math.max(p.invincible,30);setFighterState(p,'idle');}
    return;
  }
  if(p.stun>0) {
    setFighterState(p,'stunned');p.x=clmp(p.x+p.vx,camX+22,right);p.vx*=.72;
    if(--p.stun<=0){p.vx=0;setFighterState(p,p.onGround?'idle':'jump');}
    return;
  }
  bufferAction(p,inp);
  const cd=CHAR_DEFS[p.charIdx];
  if(p.specialActive) {
    p.specialT--;setFighterState(p,'special');
    const tier=p.specialTier;
    if(p.specialT%(tier===2?6:8)===0) {
      if(doAreaDmg(p,tier===2?cd.sp2Range:cd.sp1Range,tier===2?cd.sp2Dmg:cd.sp1Dmg,cd.flashClr)) {
        addShake(2);cd.partFn(p.x,p.y);impact(2);
      }
    }
    if(p.specialT<=0){p.specialActive=false;p.landT=10;setFighterState(p,'idle');}
    return;
  }
  if(p.attack) {
    const a=p.attack;a.elapsed++;p.atkTimer--;
    if(a.elapsed>=a.startup && a.elapsed<a.startup+a.active)doSwingAtk(p,a.damage,a.range, a.kind==='punch'?cd.punchClr:cd.kickClr);
    if(p.atkTimer<=0) {
      if(!a.connected){p.comboN=0;p.comboT=0;}
      p.attack=null;setFighterState(p,p.onGround?'idle':'jump');
    }
    return;
  }
  if(p.landT>0){p.landT--;setFighterState(p,'idle');return;}
  const action=requestedAction(inp)||p.buffer?.action;p.buffer=null;
  const mx=inp.right?1:inp.left?-1:0,my=inp.down?1:inp.up?-1:0;
  if(p.onGround && mx)p.dir=mx;
  if(action==='special1'||action==='special2') {
    const tier=action==='special2'?2:1,cost=tier===2?cd.sp2Cost:cd.sp1Cost;
    if(p.onGround && p.special>=cost) {
      p.special-=cost;p.specialActive=true;p.specialTier=tier;p.specialT=tier===2?cd.sp2Dur:cd.sp1Dur;
      setFighterState(p,'special');p.fr=0;
      addFlash(cd.flashClr,.45);addShake(6);
      spawnTxt(p.x,p.y-110,tier===2?cd.sp2Name:cd.sp1Name,cd.sp1Clr,20);
      (tier===2?cd.sp2Snd:cd.sp1Snd)();return;
    }
  }
  if(action==='jump' && p.onGround) {
    p.z=1;p.vz=motion.jumpSpeed;p.vx=mx*motion.walkX;p.onGround=false;p.moveX=0;p.moveY=0;
    setFighterState(p,'jump');return;
  }
  if(action==='kick'||action==='punch') {
    startPlayerAttack(p,!p.onGround?(action==='punch'?'jumppunch':'jumpkick'):action);return;
  }
  if(p.onGround) {
    const diagonal=mx&&my?Math.SQRT1_2:1;
    // Brief acceleration smooths starts; release remains precise with no skating.
    p.moveX=mx?(PLAYER_ART_KEYS[p.charIdx]?approachSpeed(Math.sign(p.moveX)===mx?p.moveX:0,mx*motion.walkX*diagonal,motion.accel):mx*motion.walkX*diagonal):0;
    p.moveY=my?(PLAYER_ART_KEYS[p.charIdx]?approachSpeed(Math.sign(p.moveY)===my?p.moveY:0,my*motion.walkY*diagonal,motion.accel):my*motion.walkY*diagonal):0;
    const oldX=p.x,oldY=p.y;
    let nx=p.x+p.moveX;
    const other=PLAYERS.find(o=>o!==p&&!o.inactive);
    if(other)nx=clmp(nx,other.x-480,other.x+480);
    p.x=clmp(nx,minX,right);
    p.y=clmp(p.y+p.moveY,LANE_BACK,LANE_FRONT);
    p.stride=(p.stride||0)+Math.hypot(p.x-oldX,(p.y-oldY)*motion.walkX/motion.walkY);
    setFighterState(p,mx||my?'walk':'idle');
  } else setFighterState(p,'jump');
  p.special=Math.min(p.maxSpecial,p.special+.04);
}

function canReceiveHit(e) {return !e.fallen&&!e.dead&&!e.inactive&&e.state!=='intro'&&!e.dying&&!e.downT&&!e.riseT&&!(e.invincible>0);}
function inStrikeLane(attacker,target,range,lane=COMBAT.lane) {
  const dx=(target.x-attacker.x)*attacker.dir;
  return dx>=-8&&dx<=range&&Math.abs(groundLane(target)-groundLane(attacker))<=lane;
}
function doSwingAtk(p,dmg,range,clr) {
  const a=p.attack;if(!a || p.z>100)return false;
  let hit=false;
  for(const prop of GS.supplies||[]) {
    if(prop.broken||a.hits.has(prop)||!inStrikeLane(p,prop,range))continue;
    a.hits.add(prop);prop.hp-=dmg;hit=true;
    if(prop.hp<=0)breakSupply(prop);
  }
  for(const e of [...GS.enemies,...(GS.boss?[GS.boss]:[])]) {
    if(!canReceiveHit(e)||a.hits.has(e)||!inStrikeLane(p,e,range+(e===GS.boss?15:0)))continue;
    a.hits.add(e);
    const zone=attackHitZone(a);
    if(e===GS.boss)hitBoss(p,e,dmg,zone);else hitEnemy(p,e,dmg,clr,a.finisher||a.kind==='jumpkick',zone);
    hit=true;
  }
  if(hit) {
    if(!a.connected){p.comboN=a.finisher?0:p.comboN+1;p.comboT=60;a.connected=true;}
    impact(a.finisher||a.kind!=='punch'?6:4);addShake(a.finisher?4:2);sndHit();
    if(a.finisher)spawnTxt(p.x,p.y-95,'FINISHER!','#ffd080',16);
  }
  return hit;
}
function doAreaDmg(p,range,dmg,clr) {
  let hit=false;
  for(const e of GS.enemies) {
    if(canReceiveHit(e)&&Math.hypot(e.x-p.x,e.y-p.y)<range+(e.def.scale||1)*20){hitEnemy(p,e,dmg,clr,false);hit=true;}
  }
  if(GS.boss&&canReceiveHit(GS.boss)&&Math.hypot(GS.boss.x-p.x,GS.boss.y-p.y)<range+40){hitBoss(p,GS.boss,dmg);hit=true;}
  return hit;
}
const HIT_ZONES={head:2,upper:1,lower:.7};
const HIT_ZONE_COLORS={lower:'#66ef87',upper:'#66b5ff',head:'#ff5757'};
function damageNumber(target,damage,zone,yOffset=55){
  spawnTxt(target.x,target.y-yOffset,String(Math.round(damage*100)/100),HIT_ZONE_COLORS[zone]||HIT_ZONE_COLORS.upper,18);
}
function hitZoneDamage(base,zone='upper'){
  return Math.round(base*(HIT_ZONES[zone]??1)*100)/100;
}
function attackHitZone(attack){
  if(attack?.hitZone)return attack.hitZone;
  if(attack?.variant==='high'||attack?.kind==='jumppunch')return 'head';
  if(attack?.variant==='low')return 'lower';
  return 'upper';
}
function fighterHitHeight(e){
  if(PLAYERS.includes(e))return 144*fighterDepthScale(e.y);
  const key=(e.name||e.type||'').toLowerCase().replaceAll(' ','-');
  return (CHARACTER_IMAGES[key]?.height||144*(e.def?.scale||1))*fighterDepthScale(e.y);
}
function projectileHitZone(projectile,target){
  const height=(projectile.z-(target.z||0))/fighterHitHeight(target);
  return height>=.82?'head':height<.45?'lower':'upper';
}
function blockerStunMultiplier(e){return e.type==='shield'||e.profile?.guard?2:1;}
function shieldBlocks(shooter,e){
  return (e.type==='shield'||e.name==='Shield Captain')&&e.onGround&&!e.stun&&!e.downT&&!e.riseT&&
    (shooter.x-e.x)*e.dir>=0&&(!e.attack||e.attack.elapsed<e.attack.startup);
}
function showShieldBlock(e){
  e.blockT=12;
  spawnParts(e.x+e.dir*22,e.y-65,'#d9e9ff',6,3);

function playerVisual(r,state,fr) {
  const hero=PLAYER_ART_KEYS[r.charIdx];
  if(r.attack?.kind==='jumppunch'&&!['stunned','knockdown','dying','getup'].includes(r.state)) {
    const a=r.attack,t=a.elapsed;
    const i=t<a.startup?Math.min(1,Math.floor(t/a.startup*2)):t<a.startup+a.active?2+Math.min(1,Math.floor((t-a.startup)/a.active*2)):4+Math.min(1,Math.floor((t-a.startup-a.active)/a.recovery*2));
    // Reuse each fighter's downward hand strike at its airborne position.
    return {state:'punch_low',fr:i*aStep('punch_low')};
  }
  if(hero&&r.attack&&r.attack.kind!=='jumpkick'&&!['stunned','knockdown','dying','getup'].includes(r.state)) {
    const a=r.attack,t=a.elapsed,variantState=a.kind+'_'+a.variant;
    if(a.variant!=='middle'&&SPR[hero+'_'+variantState]?.poses){
      const i=t<a.startup?Math.min(1,Math.floor(t/a.startup*2)):
        t<a.startup+a.active?2+Math.min(1,Math.floor((t-a.startup)/a.active*2)):
        4+Math.min(1,Math.floor((t-a.startup-a.active)/a.recovery*2));
      return {state:variantState,fr:i*aStep(variantState)};
    }
  }
  const expanded=hero&&SPR[hero+'_idle']?.poses?.length===8;
  if(expanded) {
    const pose=(state,i)=>({state,fr:i*aStep(state)});
    if(r.state==='stunned')return pose('stunned',Math.min(2,Math.floor(r.fr/6)));
    if(r.state==='knockdown'||r.state==='dying')return pose('knockdown',r.fr<8?0:1);
    if(r.state==='getup')return pose('getup',Math.min(2,Math.floor((1-r.riseT/COMBAT.rise)*3)));
    if(r.attack&&r.attack.kind!=='jumpkick') {
      const a=r.attack,t=a.elapsed;
      const i=t<a.startup?Math.min(2,Math.floor(t/a.startup*3)):
        t<a.startup+a.active?3+Math.min(1,Math.floor((t-a.startup)/a.active*2)):
        5+Math.min(2,Math.floor((t-a.startup-a.active)/a.recovery*3));
      return pose(a.kind,i);
    }
    if(!r.attack&&!r.specialActive&&r.onGround&&r.landingVisual>0)return pose('landing',Math.min(2,Math.floor((10-r.landingVisual)/4)));
    if(state==='jump'&&!r.onGround)return pose('jump',1+Math.min(4,Math.floor(clmp((motionFor(r).jumpSpeed-r.vz)/(motionFor(r).jumpSpeed*2),0,1)*5)));
    if(state==='special'&&r.specialActive)return pose('special',r.specialT<=3?7:Math.floor((r.fr||0)/2)%8);
  }

  if(r.attack) {
    const a=r.attack,t=a.elapsed;
    state=a.kind==='jumpkick'?'jumpkick':state;
    const active=a.active||4;
    const pose=t<a.startup?Math.min(1,Math.floor(t/a.startup*2)):
      t<a.startup+active?2+Math.min(1,Math.floor((t-a.startup)/active*2)):
      4+Math.min(1,Math.floor((t-a.startup-active)/a.recovery*2));
    return {state,fr:pose*aStep(state)};
  }
  if(state==='jump'&&!r.onGround) {
    const speed=motionFor(r).jumpSpeed;
    const progress=clmp((speed-r.vz)/(speed*2),0,1);
    return {state,fr:Math.min(5,Math.floor(progress*6))*aStep('jump')};
  }
  if(state==='special'&&r.specialActive) {
    const period=r.specialTier===2?6:8;
    const untilHit=r.specialT%period;
    // Repeat strike/retract through the entire move; recover only at its end.
    const pose=r.specialT<=3?5:untilHit===0?3:untilHit<=2?4:untilHit<=4?2:1;
    return {state,fr:pose*aStep('special')};
  }
  if(hero&&state==='walk')fr=(r.stride||0)/motionFor(r).strideDistance*(SPR[hero+'_walk']?.poses?.length||6)*aStep('walk');
  if(hero&&state==='idle')fr=r.motionFr||fr;
  return {state,fr};
}
// Continuous body motion between authored poses, anchored at the feet.
function playerBodyMotion(r,state) {
  if(r.state==='stunned'||r.downT||r.riseT)return;
  if(state==='walk') {
    const phase=(r.stride||0)/KEN_MOTION.strideDistance*Math.PI*2;
    // One rise per passing foot; fade the posture in rather than snapping to a lean.
    const weight=r.walkBlend||0;
    ctx.translate(0,-(1-Math.cos(phase*2))*.55*weight);
    ctx.transform(1,0,r.dir*-.008*weight,1,0,0);
  } else if(!r.onGround) {
    const stretch=clmp(r.vz/KEN_MOTION.jumpSpeed,-1,1)*.025;
    ctx.scale(1-stretch*.5,1+stretch);
  }
  if(state==='special'&&r.specialActive){const period=r.specialTier===2?6:8;ctx.translate(r.dir*Math.sin(r.specialT/period*Math.PI*2)*1.5,0);}
  if(r.landingVisual>0){const squash=Math.sin(r.landingVisual/10*Math.PI)*.045;ctx.scale(1+squash*.5,1-squash);}
  if(r.attack){const a=r.attack;const pulse=Math.sin(clmp((a.elapsed-a.startup+2)/(a.active+4),0,1)*Math.PI);ctx.translate(r.dir*pulse*3,0);}
}
function drawFighter(r,camX) {
  const y=visualValue(r,'y'),sx=visualValue(r,'x')-camX,z=visualValue(r,'z'),depthScale=fighterDepthScale(y);
  ctx.save();if(r.fallen&&r.onGround)ctx.globalAlpha=Math.min(1,r.groundDownT/24);
  drawGroundShadow(sx,y,(r.fallen?55:24)*depthScale,z);ctx.restore();
  ctx.save();
  // Keep authored fighter pixels crisp when depth and Retina scaling enlarge them.
  if(PLAYERS.includes(r))ctx.imageSmoothingEnabled=false;
  ctx.translate(sx,y-z);ctx.scale(depthScale,depthScale);
  if(PLAYERS.includes(r))ctx.scale(144/176,144/176);
  if(r.fallen&&drawEnemyFall(r)){ctx.restore();return;}
  let state=r.state,fr=r.fr;
  const authoredReaction=PLAYERS.includes(r)&&SPR[PLAYER_ART_KEYS[r.charIdx]+'_'+(r.state==='dying'?'knockdown':r.state)]?.poses;
  if(!authoredReaction&&(r.state==='knockdown'||r.state==='dying')) {ctx.translate(0,-16);ctx.rotate(-r.dir*1.35);state='idle';}
  else if(!authoredReaction&&r.state==='getup'){const t=r.riseT/COMBAT.rise;ctx.rotate(-r.dir*1.35*(r.charIdx===0?t*t*(3-2*t):t));state='idle';}
  else if(!authoredReaction&&r.state==='stunned'){ctx.rotate(-r.dir*.18);ctx.translate(-r.dir*5,0);state='idle';}
  if(r.attack) {
    const a=r.attack,t=a.elapsed;
    const pose=t<a.startup?Math.min(1,Math.floor(t/a.startup*2)):t<a.startup+(a.active||4)?2+Math.min(1,Math.floor((t-a.startup)/(a.active||4)*2)):4+Math.min(1,Math.floor((t-a.startup-(a.active||4))/a.recovery*2));
    fr=pose*aStep(state);
  }
  if(PLAYERS.includes(r))({state,fr}=playerVisual(r,state,fr));
  if(PLAYERS.includes(r))playerBodyMotion(r,state);
  if(PLAYERS.includes(r)&&(drawKenMove(r)||drawReiMove(r))) { /* Authored Ken move poses. */ }
  else if(tryDrawCharacterArt(r)) { /* The new roster uses its own authored poses. */ }
  else if(PLAYERS.includes(r))CHAR_DEFS[r.charIdx].drawFn(0,0,r.dir,r.charIdx>0&&r.state==='stunned'?'stunned':state,fr,r.invincible);
  else if(r===GS.boss)drawCampaignBoss(r,state,fr);
  else drawEnemy(0,0,r.dir,state,fr,r.def,r.hp,r.maxHp);
  ctx.restore();
}

function startLevel(idx,options={}) {
  const lvl=LEVELS[idx];
  if(!GS.story)resetCampaign();
  hitStop=0;
  GS.lvlIdx=idx; GS.enemies=[]; GS.projectiles=[]; GS.boss=null; GS.bossActive=false;
  GS.spawnedWaves=new Set(); GS.midMsgShown=false; GS.state='playing';
  cam.x=0; cam.tx=0; cam.maxX=LEVEL_W-gameplayViewWidth();
  PARTS.length=0; FTEXTS.length=0;
  resetPlayer(P1, 100);
  resetPlayer(P2, 210);
  GS.nodeIndex=0;GS.encounterActive=false;GS.arena=null;GS.routeDelay=0;GS.pickups=[];
  GS.supplies=lvl.route.filter(n=>n.kind!=='boss').map((n,i)=>({x:n.x+120,y:GROUND_Y+(i%2?28:-35),hp:20,broken:false,taken:false,kind:supplyForMap(idx,i),container:containerForMap(idx),revealT:0}));
  GS.resultFr=0;
  const cp=options.checkpoint;
  if(cp) {
    GS.nodeIndex=cp.nodeIndex;
    PLAYERS.forEach((p,i)=>{p.inactive=i===1&&GS.mode==='1p';p.lives=3;p.hp=p.maxHp;p.special=40;p.charIdx=cp.players[i].charIdx;p.score=cp.players[i].score;resetPlayer(p,cp.x+i*70);});
    cam.x=clmp(cp.x-gameplayViewWidth()/2,0,LEVEL_W-gameplayViewWidth());cam.tx=cam.x;
  }
  // 1-player mode: P2 sits out
  if (GS.mode==='1p') { P2.inactive=true; P2.lives=0; }
  if(!cp)captureCheckpoint(0,100);
  showDialog([lvl.title, lvl.subtitle], 200);
}

// Debug destinations share normal encounter setup so boss defeat advances the route.
const DEBUG_START={map:0};
function debugWarp(toBoss=false) {
  const idx=DEBUG_START.map;
  if(!Number.isInteger(idx)||!LEVELS[idx])return;
  if(!JOIN.enabled||!JOIN.sources[0]) {
    beginJoining();JOIN.sources[0]={type:'keyboard',id:0};GS.mode='1p';
  }
  JOIN.selecting=[false,false];
  GS.mode=JOIN.sources[1]?'2p':'1p';
  PLAYERS.forEach(p=>{p.inactive=false;p.lives=3;p.hp=p.maxHp;p.special=40;});
  resetCampaign();startLevel(idx);
  if(toBoss) {
    const nodeIndex=LEVELS[idx].route.findIndex(n=>n.kind==='boss');
    if(nodeIndex>=0) {
      GS.nodeIndex=nodeIndex;const node=LEVELS[idx].route[nodeIndex];
      PLAYERS.forEach((p,i)=>{p.x=node.x-180+i*70;});
      cam.x=clmp(node.x-430,0,LEVEL_W-gameplayViewWidth());cam.tx=cam.x;
      beginEncounter(node);
    }
  }
  clearKeys();for(const key in keys)delete keys[key];updateGpPrev();
}
function initDebugBar() {
  const picker=document.getElementById('debugMap');
  picker.innerHTML=LEVELS.map((lvl,i)=>`<option value="${i}">${i+1}. ${GAME_I18N.translate(lvl.name)} — ${GAME_I18N.translate(lvl.bossName)}</option>`).join('');
  picker.value=String(DEBUG_START.map);
  const replay=document.getElementById('debugIntro');
  replay.addEventListener('click',()=>{debugWarp(false);startOpening();replay.blur();});
  picker.addEventListener('change',()=>{DEBUG_START.map=Number(picker.value);picker.blur();});
  for(const [id,boss] of [['debugStart',false],['debugBoss',true]]) {
    const button=document.getElementById(id);
    button.addEventListener('click',()=>{debugWarp(boss);button.blur();});
  }
}

function showDialog(lines, dur) { GS.dialog={lines,timer:dur}; }

//  MAIN UPDATE
// ════════════════════════════════════════════════════════════════════
function update() {
  if(['gameover','nameentry','highscores'].includes(GS.state)){updateArcade();return;}
  if (GS.state!=='playing' && GS.state!=='boss') return;

  if(JOIN.enabled){pollJoins(true);JOIN.selecting.forEach((selecting,i)=>{if(selecting)selectJoinedPlayer(i,true);});}

  if(hitStop>0) {
    PLAYERS.forEach((p,i)=>bufferAction(p,getInput(i)));
    hitStop--;updateGpPrev();return;
  }
  GS.enemies=GS.enemies.filter(e=>!e.dead);
  updateCampaignRoute();
  const advLimit=GS.arena?.right||LEVEL_W;

  // Read inputs & update players
  const inp0=getInput(0), inp1=getInput(1);
  updatePlayer(P1, 0, inp0, cam.x, advLimit);
  updatePlayer(P2, 1, inp1, cam.x, advLimit);

  updateCam(PLAYERS, advLimit);
  GS.enemies.forEach(e=>updateEnemy(e));
  if (GS.boss) updateBoss(GS.boss);
  updateEnemyProjectiles();
  separateFighters();
  updateParts(); updateFTexts(); updateFX();
  if (GS.dialog) { GS.dialog.timer--; if (GS.dialog.timer<=0) GS.dialog=null; }

  updateGpPrev();
}

let glFr=0;

function resetToTitle() {
  JOIN.enabled=false;JOIN.sources=[null,null];JOIN.selecting=[false,false];
  hitStop=0;
  GS.state='title'; glFr=0;
  GS.resultFr=0; GS.modeCursor=0;
  GS.enemies=[]; GS.projectiles=[]; GS.boss=null; GS.bossActive=false;
  GS.spawnedWaves=new Set(); GS.midMsgShown=false; GS.dialog=null;
  PARTS.length=0; FTEXTS.length=0;
  shakeAmt=0; flashA=0;
  PLAYERS.forEach(p=>{ p.score=0; p.lives=3; p.hp=p.maxHp; p.special=0; p.inactive=false; });
  resetCS();
}

function render() {
  const hint=document.getElementById('hint');
  if(!hint.originalText)hint.originalText=hint.textContent;
  if(hint.originalText)hint.textContent=GAME_I18N.language==='en'?hint.originalText:GAME_I18N.language==='ja'?'P1: WASD 移動・H パンチ・K キック・U ジャンプ ｜ P2: ↑↓←→／Num 1 2 3 ｜ K+H 必殺技・U+K+H 超必殺技':'P1: WASD 移動・H 拳擊・K 踢擊・U 跳躍 ｜ P2: ↑↓←→／Num 1 2 3 ｜ K+H 必殺技・U+K+H 超必殺技';
  document.getElementById('hint').style.display=GS.state==='title'?'none':'';
  ctx.clearRect(0,0,W,H);
  const shx=shakeAmt>0.5?rnd(-shakeAmt,shakeAmt):0;
  const shy=shakeAmt>0.5?rnd(-shakeAmt,shakeAmt):0;
  ctx.save(); ctx.translate(shx,shy);

  // ESC always returns to title from any screen except title itself
  if (GS.state !== 'title' && press('Escape')) {
    resetToTitle();
    ctx.restore(); return;
  }

  if (GS.state==='title') {
    glFr++;
    drawTitle(glFr);
    if (press('KeyR')&&loadCampaignSave()) {
      sndConfirm();
    } else if (press('KeyT')) {
      GS.state='settings'; settingsCursor=0; sndCursor();
    } else if (press('Enter','Space','KeyH','KeyK','Numpad1','Numpad2') || anyGpPress()) {
      resetCampaign();beginJoining();pollJoins();GS.state='charselect';
      sndCursor();
    }

  } else if (GS.state==='modeselect') {
    glFr++; GS.modeFr++;
    updateModeSelect();
    drawModeSelect(glFr);

  } else if (GS.state==='settings') {
    glFr++;
    updateSettings();
    drawSettings(glFr);

  } else if (GS.state==='charselect') {
    glFr++;
    updateCharSelect();
    drawCharSelect(glFr);

  } else if (GS.state==='intro') {
    glFr++;
    updateOpening();
    if (GS.state==='intro') drawOpening();

  } else if (GS.state==='playing'||GS.state==='boss') {
    drawGameplayScene();

  } else if (GS.state==='levelclear') {
    glFr++; GS.resultFr++;
    drawGameplayScene();drawResultScreen('levelclear');
    if (GS.resultFr>60 && (press('Enter','Space','KeyH','Numpad1')||anyGpPress())) {
      if (GS.lvlIdx<LEVELS.length-1) {
        GS.resultFr=0;
        // Revive P1; only revive P2 in 2P mode
        if (P1.inactive) { P1.inactive=false; P1.hp=P1.maxHp; P1.lives=1; P1.invincible=90; }
        if (GS.mode==='2p' && P2.inactive) { P2.inactive=false; P2.hp=P2.maxHp; P2.lives=1; P2.invincible=90; }
        startLevel(GS.lvlIdx+1);
      } else { GS.state='victory'; GS.resultFr=0; }
    }

  } else if (GS.state==='victory') {
    glFr++; GS.resultFr++;
    drawGameplayScene();drawResultScreen('victory');
    if (GS.resultFr>80 && (press('Enter','Space','KeyH','Numpad1')||anyGpPress())) {
      hitStop=0;
  GS.state='title'; glFr=0;
    }

  } else if (['gameover','nameentry','highscores'].includes(GS.state)) {
    drawGameplayScene();drawArcadeOverlay();
  }

  if (flashA>0.01) {
    ctx.fillStyle=flashClr; ctx.globalAlpha=flashA;
    ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawGameplayScene(){
    const camX=Math.round(cam.x);
    ctx.save();ctx.translate(0,GROUND_Y*(1-GAMEPLAY_ZOOM));ctx.scale(GAMEPLAY_ZOOM,GAMEPLAY_ZOOM);
    sceneWidth=gameplayViewWidth();sceneTop=-GROUND_Y*(1-GAMEPLAY_ZOOM)/GAMEPLAY_ZOOM;
    sceneBottom=GROUND_Y+(H-GROUND_Y)/GAMEPLAY_ZOOM;
    drawCampaignScenery(camX);
    drawCampaignMarkers(camX);

    const renderList=[
      ...GS.enemies.filter(e=>!e.dead),
      ...(GS.boss&&!GS.boss.dead?[GS.boss]:[]),
      ...PLAYERS.filter((p,i)=>!p.inactive||(['gameover','nameentry','highscores'].includes(GS.state)&&(i===0||GS.mode==='2p'))),
    ].sort((a,b)=>a.y-b.y);

    renderList.forEach(r=>drawFighter(r,camX));
    drawReiMoveEffects(camX);
    drawEnemyProjectiles(camX);

    drawParts(camX);
    drawArcadeForeground(camX,['village','city','prison','cult','capital'].includes(LEVELS[GS.lvlIdx].theme));
    drawFTexts(camX);
    ctx.restore();sceneWidth=W;sceneTop=0;sceneBottom=H;
    drawCampaignObjective();
    drawHUD(); drawDialogBox();
    drawGamepadIcons();

}

function drawPlayerHUD(p, pIdx, bx) {
  const cd  = CHAR_DEFS[p.charIdx];
  const clr = cd.hudClr;
  const label=`P${pIdx+1} ${cd.shortName}`;

  ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(bx,8,206,50);
  // HP
  const hpG=ctx.createLinearGradient(bx+2,0,bx+202,0);
  hpG.addColorStop(0,'#22ee22'); hpG.addColorStop(0.5,'#ffaa00'); hpG.addColorStop(1,'#ff2222');
  ctx.fillStyle=hpG; ctx.fillRect(bx+2,10,202*(p.hp/p.maxHp),18);
  ctx.fillStyle='#fff'; ctx.font='bold 10px Courier New';
  ctx.fillText(`${label}  ♥${p.hp}`, bx+5, 23);

  // Lives
  ctx.fillStyle='#ff0'; ctx.font='bold 12px Courier New';
  ctx.fillText(`★${p.lives}`, bx+2, 37);

  // Special bar
  const cd2 = CHAR_DEFS[p.charIdx];
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx+2,40,202,12);
  const spG=ctx.createLinearGradient(bx+2,0,bx+202,0);
  spG.addColorStop(0,clr); spG.addColorStop(1,'#ffaa00');
  ctx.fillStyle=spG; ctx.fillRect(bx+2,41,202*(p.special/p.maxSpecial),10);
  // Threshold tick at sp1Cost%
  const t1x = bx+2 + 202*(cd2.sp1Cost/p.maxSpecial);
  const t2x = bx+2 + 202*(cd2.sp2Cost/p.maxSpecial);
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillRect(t1x,40,2,12);
  ctx.fillStyle='rgba(255,220,0,0.9)';   ctx.fillRect(t2x,40,2,12);

    ctx.fillText(`METER ${Math.floor(p.special)}%  K+P·J+K+P`, bx+5, 50);

  if (p.inactive) {

  // Combo
  if (p.comboN>=3 && p.comboT>0) {

  const mvR = press('ArrowRight','KeyD','ArrowDown','KeyS') || gpJustPressed(0,15)||gpJustPressed(0,13);
  const mvL = press('ArrowLeft','KeyA','ArrowUp','KeyW')    || gpJustPressed(0,14)||gpJustPressed(0,12);
  if (mvR && GS.modeCursor===0) { GS.modeCursor=1; sndCursor(); }
  if (mvL && GS.modeCursor===1) { GS.modeCursor=0; sndCursor(); }

  if (press('Enter','Space','KeyH','KeyK','KeyU','Numpad1','Numpad2','Numpad3') || [0,1].some(p=>[0,1,2,9].some(b=>gpJustPressed(p,b)))) {

function updateSettings() {
  const up=press('ArrowUp','KeyW')||gpJustPressed(0,12);
  const down=press('ArrowDown','KeyS')||gpJustPressed(0,13);
  const left=press('ArrowLeft','KeyA')||gpJustPressed(0,14);
  const right=press('ArrowRight','KeyD')||gpJustPressed(0,15);
  if (up) { settingsCursor=(settingsCursor+SETTINGS_ITEMS.length-1)%SETTINGS_ITEMS.length; sndCursor(); }
  if (down) { settingsCursor=(settingsCursor+1)%SETTINGS_ITEMS.length; sndCursor(); }
  const item=SETTINGS_ITEMS[settingsCursor];
  if (left||right) {
    const dir=right?1:-1;
    if (item==='joystick'||item==='invertY') INPUT_SETTINGS[item]=!INPUT_SETTINGS[item];
    if (item==='deadzone') INPUT_SETTINGS.deadzone=clmp(INPUT_SETTINGS.deadzone+dir*.04,.08,.5);
    if (item==='p1Pad') changePadSetting('p1Pad',dir);
    if (item==='p2Pad') changePadSetting('p2Pad',dir);
    sndCursor();
  }
  if (press('Enter','Space','KeyH','KeyK','KeyU')||gpJustPressed(0,0)) {
    if (item==='joystick'||item==='invertY') INPUT_SETTINGS[item]=!INPUT_SETTINGS[item];
    else if (item==='deadzone') INPUT_SETTINGS.deadzone=INPUT_SETTINGS.deadzone>=.5?.08:INPUT_SETTINGS.deadzone+.04;
    else if (item==='p1Pad') changePadSetting('p1Pad',1);
    else if (item==='p2Pad') changePadSetting('p2Pad',1);
    sndConfirm();
  }
  if (press('Escape','Backspace')) { GS.state='title'; sndCursor(); }
  updateGpPrev();
}

// ── "Burning Road to Raoh"  opening cinematic ─────────────────────

// Scene 1 : Kenshiro appears from the desert    (120 fr ≈ 2.0 s)
