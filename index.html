const INTRO_DUR = [110, 120, 125, 220, 130, 140, 110, 90];

// ── Helpers ──────────────────────────────────────────────────────────
function iSpeedLines(cx, cy, minR, maxR, clr, n, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = clr;
  const wPat = [2.6,0.7,1.5,0.6,1.8,0.7,2.2,0.6];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    ctx.lineWidth = wPat[i % 8];
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*minR, cy + Math.sin(a)*minR);
    ctx.lineTo(cx + Math.cos(a)*maxR, cy + Math.sin(a)*maxR);
    ctx.stroke();
  }
  ctx.restore();
}

function iTypeStr(str, t, speed) {
  return str.substring(0, Math.min(str.length, Math.floor(Math.max(0, t) / speed)));
}

// Draw typewriter captions, second line waits for first to finish
function iCaptions(lines, baseY, clr, t, speed) {
  speed = speed || 2;
  ctx.textAlign = 'center';
  let ty = baseY, rem = t;
  lines.forEach(line => {
    const shown = iTypeStr(line, rem, speed);
    rem -= line.length * speed + 18;
    if (shown.length === 0) { ty += 30; return; }
    ctx.font = 'bold 15px Courier New';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.strokeText(shown, W/2, ty);
    ctx.fillStyle = clr; ctx.fillText(shown, W/2, ty);
    ty += 30;
  });
  ctx.textAlign = 'left';
}

// Large centred text with outline
function iBigTxt(txt, x, y, clr, size) {
  ctx.textAlign = 'center';
  ctx.font = `bold ${size}px Courier New`;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 8; ctx.strokeText(txt, x, y);
  ctx.fillStyle = clr; ctx.fillText(txt, x, y);
  ctx.textAlign = 'left';
}

  ctx.beginPath(); ctx.arc(0,-80*f,12*f,0,Math.PI*2); ctx.fill();
  ctx.fillRect(-16*f,-90*f,32*f,7*f); ctx.fillRect(-4*f,-98*f,8*f,10*f);
  ctx.restore();
}
function _silRaoh(cx, cy, s) {
  const f = s / 100;
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillRect(-24*f,-95*f,48*f,66*f);
  ctx.fillRect(-44*f,-95*f,22*f,26*f); ctx.fillRect(22*f,-95*f,22*f,26*f);
  ctx.fillRect(-18*f,-10*f,14*f,36*f); ctx.fillRect(4*f,-10*f,14*f,36*f);
  ctx.beginPath(); ctx.arc(0,-108*f,18*f,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-14*f,-120*f); ctx.lineTo(-38*f,-146*f); ctx.lineTo(-6*f,-124*f); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo( 14*f,-120*f); ctx.lineTo( 38*f,-146*f); ctx.lineTo(  6*f,-124*f); ctx.closePath(); ctx.fill();
  ctx.fillRect(-4*f,-132*f,8*f,26*f);
  ctx.fillRect(20*f,-78*f,16*f,14*f); ctx.fillRect(34*f,-86*f,12*f,16*f);
  ctx.fillRect(-26*f,26*f,52*f,16*f);
  ctx.beginPath(); ctx.arc(-24*f,34*f,10*f,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 24*f,34*f,10*f,0,Math.PI*2); ctx.fill();
  ctx.fillRect(-8*f,40*f,6*f,24*f); ctx.fillRect(2*f,40*f,6*f,24*f);
  ctx.restore();
}

// ── Update ───────────────────────────────────────────────────────────
function updateIntro() {
  INTRO.t++;
  const dur = INTRO_DUR[INTRO.scene] || 120;

  if (INTRO.t >= dur) {
    INTRO.scene++;
    INTRO.t = 0;
    if (INTRO.scene === 1) { beep(200,0.55,0.16,'sawtooth',70); }
    if (INTRO.scene === 2) { addFlash('#cc0000',0.65); addShake(5); beep(100,0.5,0.20,'sawtooth',44); }
    if (INTRO.scene === 3) { beep(120,0.4,0.15,'sawtooth',60); }
    if (INTRO.scene === 4) { addFlash('#ffffff',0.5); addShake(8); beep(80,0.8,0.22,'sawtooth',38); }
    if (INTRO.scene === 5) { addFlash('#cc0000',0.55); }
    if (INTRO.scene === 6) { addFlash('#ffffff',0.75); addShake(12); beep(60,1.0,0.28,'sawtooth',25); }
    if (INTRO.scene === 7) { addFlash('#cc0000',0.95); addShake(18);
                              beep(440,0.1,0.22,'square'); setTimeout(()=>beep(660,0.15,0.2,'square'),110); }
    if (INTRO.scene >= INTRO_DUR.length) { startLevel(0); return; }
  }

  if (INTRO.t > 20 &&
     (press('Enter','Space','KeyH','KeyK','KeyU','Numpad1','Numpad2','Numpad3','Escape') ||
      anyGpPress())) {
    startLevel(0); return;
  }
  updateGpPrev();
}

// ── Draw ─────────────────────────────────────────────────────────────
function drawIntro(fr) {
  const sc  = INTRO.scene;
  const t   = INTRO.t;
  if (sc >= INTRO_DUR.length) return;
  const dur   = INTRO_DUR[sc];
  const fadeI = Math.min(1, t / 20);
  const fadeO = Math.max(0, 1 - (t - (dur - 20)) / 20);
  const vis   = Math.min(fadeI, fadeO);

  ctx.save();
  ctx.globalAlpha = vis;

  // ══ Scene 0 : Ruined wasteland + narrator ══════════════════════════
  if (sc === 0) {
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#0a0000'); sky.addColorStop(0.5,'#2a0800'); sky.addColorStop(1,'#1a0500');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    // Embers
    for (let i=0;i<28;i++) {
      const ex=((i*173+t*(0.3+i*0.025))%(W+40));
      const ey=((i*47+t*(0.8+i*0.04))%H+H*4)%H;
      ctx.globalAlpha=vis*(0.35+Math.sin(t*0.07+i)*0.3);
      ctx.fillStyle=i%3===0?'#ff7700':'#ff2200';
      ctx.beginPath(); ctx.arc(ex,ey,1.5,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=vis;
    // Broken city pan
    const pan=(t/dur)*200;
    ctx.fillStyle='#060100';
    [[0.04,88,48],[0.13,142,32],[0.25,70,54],[0.38,162,28],[0.51,102,44],
     [0.64,130,36],[0.78,66,58],[0.90,112,30]].forEach(([p,h,w])=>{
      const rx=((p*W*2.4-pan)%(W+300)+W+300)%(W+300)-80;
      ctx.fillRect(rx,H*0.52-h,w,h);
      ctx.beginPath();
      ctx.moveTo(rx-4,H*0.52-h); ctx.lineTo(rx+w*0.3,H*0.52-h-20);
      ctx.lineTo(rx+w*0.6,H*0.52-h-8); ctx.lineTo(rx+w+4,H*0.52-h-24);
      ctx.lineTo(rx+w+4,H*0.52-h); ctx.fill();
    });
    const grd=ctx.createLinearGradient(0,H*0.52,0,H);
    grd.addColorStop(0,'#3a1200'); grd.addColorStop(1,'#160600');
    ctx.fillStyle=grd; ctx.fillRect(0,H*0.52,W,H);
    // Blood sun
    const sg=ctx.createRadialGradient(W*0.76,H*0.18,0,W*0.76,H*0.18,62);
    sg.addColorStop(0,'#ff7700cc'); sg.addColorStop(0.5,'#cc330055'); sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
    // Skulls
    [60,200,340,490,640,790].forEach((bx,i)=>{
      const sx=((bx-pan*0.45)%(W+120)+W+120)%(W+120)-40;
      ctx.fillStyle='#c0b898';
      ctx.beginPath(); ctx.arc(sx,H*0.57+i%3*5,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#111';
      ctx.fillRect(sx-4,H*0.565+i%3*5,3,3); ctx.fillRect(sx+1,H*0.565+i%3*5,3,3);
      ctx.fillRect(sx-1.5,H*0.595+i%3*5,3,2);
    });
    if (t>28) iCaptions(['IN THE AGE OF VIOLENCE,','ONLY THE STRONGEST SURVIVE.'],H*0.76,'#ffaa66',Math.max(0,t-28),1.8);
    if (t>78) iCaptions(['BUT ONE MAN WALKS THE WASTELAND —','CARRYING THE FATE OF HUMANITY ON HIS FISTS.'],H*0.86,'#ffcc88',Math.max(0,t-78),1.5);

  // ══ Scene 1 : Kenshiro appears from the desert ════════════════════
  } else if (sc===1) {
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#120400'); sky.addColorStop(0.6,'#3a1000'); sky.addColorStop(1,'#2a0a00');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    const grd=ctx.createLinearGradient(0,H*0.6,0,H);
    grd.addColorStop(0,'#4a2000'); grd.addColorStop(1,'#1a0800');
    ctx.fillStyle=grd; ctx.fillRect(0,H*0.6,W,H);
    // Dust heat shimmer
    const haze=ctx.createLinearGradient(0,H*0.54,0,H*0.68);
    haze.addColorStop(0,'transparent'); haze.addColorStop(0.5,'rgba(136,68,34,0.12)'); haze.addColorStop(1,'transparent');
    ctx.fillStyle=haze; ctx.fillRect(0,0,W,H);
    // Ken approaches — starts tiny, grows
    const apT=Math.min(1,t/(dur*0.88));
    const kenScl=0.07+apT*1.55;
    const kenX=W*0.5, kenY=H*0.88;
    ctx.save();
    ctx.translate(kenX,kenY); ctx.scale(kenScl*2.2,kenScl*2.2);
    drawKen(0,0,1,af(fr)%24<12?'walk':'idle',af(fr),0);
    ctx.restore();
    // Seven stars glow when close
    if (t>52 && kenScl>0.7) {
      const ga=Math.min(1,(t-52)/18)*(0.45+Math.sin(t*0.18)*0.3);
      [[-20,-162],[0,-165],[17,-159],[-9,-152],[9,-147],[0,-137],[-5,-129]].forEach(([dx,dy])=>{
        const sx2=kenX+dx*kenScl*2.2, sy2=kenY+dy*kenScl*2.2;
        const g2=ctx.createRadialGradient(sx2,sy2,0,sx2,sy2,9*kenScl);
        g2.addColorStop(0,`rgba(255,200,0,${ga})`); g2.addColorStop(1,'transparent');
        ctx.fillStyle=g2; ctx.fillRect(sx2-16,sy2-16,32,32);
      });
    }
    // Dust swirls
    for (let i=0;i<6;i++) {
      const da=((i*60+t*1.3)%360)*Math.PI/180;
      const dr=16+kenScl*28+Math.sin(t*0.1+i)*7;
      ctx.save(); ctx.globalAlpha=vis*0.28*kenScl;
      ctx.fillStyle='#884422';
      ctx.beginPath(); ctx.arc(kenX+Math.cos(da)*dr,kenY+Math.sin(da)*dr*0.3,3+i*0.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    if (t>65) {
      const na=Math.min(1,(t-65)/18);
      ctx.save(); ctx.globalAlpha=vis*na; ctx.textAlign='center';
      ctx.font='bold 24px Courier New';
      ctx.shadowColor='#ff4400'; ctx.shadowBlur=16;
      ctx.strokeStyle='#000'; ctx.lineWidth=7;
      ctx.strokeText('KENSHIRO',W/2,H*0.22);
      ctx.fillStyle='#ff8800'; ctx.fillText('KENSHIRO',W/2,H*0.22);
      ctx.shadowBlur=0; ctx.font='13px Courier New'; ctx.fillStyle='#ffaa44';
      ctx.fillText('北斗神拳  —  HOKUTO SHINKEN',W/2,H*0.22+26);
      ctx.restore();
    }
    if (t>88) iCaptions(['HIS SEVEN SCARS GLOW BENEATH THE RED SUN.'],H*0.93,'#ffcc88',Math.max(0,t-88),1.5);

  // ══ Scene 2 : Flashback — Yuria taken by Shin ════════════════════
  } else if (sc===2) {
    ctx.fillStyle='#0e0000'; ctx.fillRect(0,0,W,H);
    const hw=W/2-12;
    // Left — Yuria
    ctx.save();
    ctx.beginPath(); ctx.rect(10,10,hw,H-20); ctx.clip();
    ctx.fillStyle='#0a0004'; ctx.fillRect(10,10,hw,H-20);
    iSpeedLines(10+hw/2,H*0.44,0,220,'#1a0008',40,0.4);
    const yx=10+hw/2, yy=H*0.76;
    ctx.fillStyle='#111118';
    ctx.beginPath(); ctx.moveTo(yx-18,yy); ctx.lineTo(yx-16,yy-70); ctx.lineTo(yx,yy-78); ctx.lineTo(yx+16,yy-70); ctx.lineTo(yx+18,yy); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(yx-18,yy); ctx.bezierCurveTo(yx-34,yy-22,yx-28,yy-42,yx-16,yy-70); ctx.lineTo(yx-18,yy); ctx.fill();
    ctx.beginPath(); ctx.moveTo(yx+18,yy); ctx.bezierCurveTo(yx+34,yy-22,yx+28,yy-42,yx+16,yy-70); ctx.lineTo(yx+18,yy); ctx.fill();
    ctx.beginPath(); ctx.arc(yx,yy-90,13,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(yx-9,yy-86); ctx.bezierCurveTo(yx-22,yy-76,yx-26,yy-48,yx-20,yy-18); ctx.lineTo(yx-16,yy-18); ctx.bezierCurveTo(yx-20,yy-48,yx-14,yy-76,yx-5,yy-86); ctx.fill();
    ctx.fillRect(yx+10,yy-76,8,10);
    ctx.save(); ctx.translate(yx+17,yy-66); ctx.rotate(-0.5); ctx.fillRect(0,-6,22,8); ctx.restore();
    drawStoryArt('julia',yx,yy,360);
    ctx.restore();
    ctx.strokeStyle='#440011'; ctx.lineWidth=2; ctx.strokeRect(10,10,hw,H-20);
    if (t>28) {
      ctx.save(); ctx.globalAlpha=vis*Math.min(1,(t-28)/18); ctx.textAlign='center';
      ctx.font='italic 12px Courier New'; ctx.fillStyle='#ffaabb';
      ctx.fillText('JULIA — WOMAN OF THE STARS',10+hw/2,H*0.88);
      ctx.restore();
    }
    // Right — Shin
    const rx=W/2+2;
    ctx.save();
    ctx.beginPath(); ctx.rect(rx,10,hw,H-20); ctx.clip();
    ctx.fillStyle='#0e0000'; ctx.fillRect(rx,10,hw,H-20);
    iSpeedLines(rx+hw/2,H*0.44,0,260,'#2a0000',50,0.5);
    if(!drawStoryArt('shin',rx+hw/2,H*0.74,380)) {ctx.fillStyle='#111'; _silShin(rx+hw/2,H*0.74,118);}
    drawStoryArt('villain-a',rx+95,H*.78,170);
    drawStoryArt('villain-b',rx+hw-95,H*.78,185,-1);
    ctx.restore();
    ctx.strokeStyle='#660000'; ctx.lineWidth=2; ctx.strokeRect(rx,10,hw,H-20);
    if (t>40) {
      ctx.save(); ctx.globalAlpha=vis*Math.min(1,(t-40)/18); ctx.textAlign='center';
      ctx.font='bold 20px Courier New'; ctx.strokeStyle='#000'; ctx.lineWidth=5;
      ctx.strokeText('SHIN',rx+hw/2,H*0.87); ctx.fillStyle='#cc0000'; ctx.fillText('SHIN',rx+hw/2,H*0.87);
      ctx.font='11px Courier New'; ctx.fillStyle='#aa4444';
      ctx.fillText('NANTO SEIKEN — SOUTHERN CROSS',rx+hw/2,H*0.87+18);
      ctx.restore();
    }
    if (t>55) iCaptions(['"LOVE BELONGS ONLY TO THOSE STRONG ENOUGH TO SEIZE IT."'],H*0.10,'#ff6666',Math.max(0,t-55),1.4);
    if (t>96) iCaptions(['KENSHIRO WAS DEFEATED.','LEFT FOR DEAD IN THE WASTELAND.'],H*0.93,'#ffaa88',Math.max(0,t-96),1.6);

  // ══ Scene 3 : Boss parade ══════════════════════════════════════════
  } else if (sc===3) {
    const BOSS_FR=Math.floor(220/6); // 36 frames per card
    const bossIdx=Math.min(5,Math.floor(t/BOSS_FR));
    const bossT=t%BOSS_FR;
    const bEnt=Math.min(1,1-Math.pow(1-Math.min(1,bossT/18),3));
    const BOSSES=[
      {name:'SHIN',    sub:'NANTO SEIKEN',          kanji:'南斗聖拳',   clr:'#cc0022',bg:'#180000',
       fn:(cx,cy)=>{if(!drawStoryArt('shin',cx,cy,350)){ctx.fillStyle='#111';_silShin(cx,cy,118);}}},
      {name:'REI',     sub:'NANTO SUICHO KEN',       kanji:'南斗水鳥拳', clr:'#0055cc',bg:'#000818',
       fn:(cx,cy)=>{drawRei(cx,cy,1,'idle',af(bossT*3),0);}},
      {name:'JAGI',    sub:'FOUL STAR OF NANTO',     kanji:'邪鬼',      clr:'#884400',bg:'#080400',
       fn:(cx,cy)=>{if(!drawStoryArt('jagi',cx,cy,350)){ctx.fillStyle='#111';_silJagi(cx,cy,118);}}},
      {name:'SOUTHER', sub:'HOLY EMPEROR',           kanji:'聖帝南斗',   clr:'#cc8800',bg:'#100800',
       fn:(cx,cy)=>{if(!drawStoryArt('souther',cx,cy,350)){ctx.fillStyle='#111';_silSouther(cx,cy,118);}}},
      {name:'TOKI',    sub:'GENTLE FIST — HOKUTO',   kanji:'北斗神拳・柔',clr:'#8844cc',bg:'#060010',
       fn:(cx,cy)=>{drawToki(cx,cy,1,'idle',af(bossT*3),0);}},
      {name:'RAOH',    sub:'KEN-OH  THE CONQUEROR',  kanji:'拳王',      clr:'#cc4400',bg:'#100000',
       fn:(cx,cy)=>{if(!drawStoryArt('raoh',cx,cy,380)){ctx.fillStyle='#111';_silRaoh(cx,cy,108);}}},
    ];
    const B=BOSSES[bossIdx];
    ctx.fillStyle=B.bg; ctx.fillRect(0,0,W,H);
    // Speed-line burst on entry
    iSpeedLines(W/2,H*0.5,0,720,B.clr,80,Math.max(0,1-bossT/18)*0.72);
    iSpeedLines(W/2,H*0.5,60,660,B.clr+'33',40,0.32);
    // Entry flash
    if (bossT<6) { ctx.save(); ctx.globalAlpha=(6-bossT)/6*0.7; ctx.fillStyle=B.clr; ctx.fillRect(0,0,W,H); ctx.restore(); }
    // Diagonal slash panel
    const sDir=bossIdx%2===0?1:-1;
    const charX=W/2+(1-bEnt)*sDir*(W*0.72);
    ctx.save(); ctx.globalAlpha=bEnt*0.3; ctx.fillStyle=B.clr;
    ctx.beginPath();
    if (sDir>0){ctx.moveTo(charX-200,0);ctx.lineTo(charX+80,0);ctx.lineTo(charX-30,H);ctx.lineTo(charX-310,H);}
    else       {ctx.moveTo(charX+200,0);ctx.lineTo(charX-80,0);ctx.lineTo(charX+30,H);ctx.lineTo(charX+310,H);}
    ctx.closePath(); ctx.fill(); ctx.restore();
    // Character
    ctx.save(); ctx.translate(charX,H*0.78); ctx.scale(2.4,2.4); B.fn(0,0); ctx.restore();
    // Name banner
    if (bossT>20) {
      const na=Math.min(1,(bossT-20)/16);
      ctx.save(); ctx.globalAlpha=vis*na; ctx.textAlign='center';
      const bx=W/2, by=H*0.12;
      ctx.fillStyle='rgba(0,0,0,0.68)'; ctx.fillRect(bx-250,by-34,500,76);
      ctx.strokeStyle=B.clr; ctx.lineWidth=2; ctx.strokeRect(bx-250,by-34,500,76);
      ctx.font='bold 38px Courier New';
      ctx.shadowColor=B.clr; ctx.shadowBlur=20;
      ctx.strokeStyle='#000'; ctx.lineWidth=9;
      ctx.strokeText(B.name,bx,by+8); ctx.fillStyle=B.clr; ctx.fillText(B.name,bx,by+8);
      ctx.shadowBlur=0;
      ctx.font='13px Courier New'; ctx.fillStyle='#cccccc'; ctx.fillText(B.sub,bx,by+28);
      ctx.font='11px Courier New'; ctx.fillStyle=B.clr+'99'; ctx.fillText(B.kanji,bx,by+44);
      ctx.restore();
    }
    // Progress dots
    for (let i=0;i<6;i++) {
      ctx.fillStyle=i===bossIdx?B.clr:'#333';

    }

  // ══ Scene 4 : Narrator "Hokuto Shinken…" ══════════════════════════
  } else if (sc===4) {
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    // Star field
    for (let i=0;i<90;i++) {
      const sx=(i*137.5)%(W-20)+10, sy=(i*87.3)%(H-20)+10;
      ctx.globalAlpha=vis*(0.25+Math.sin(t*0.06+i)*0.22);
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(sx,sy,0.7+(i%3)*0.35,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=vis;
    // Big Dipper silhouette
    const s7=[[W*0.12,H*0.21],[W*0.22,H*0.17],[W*0.32,H*0.13],[W*0.41,H*0.18],
              [W*0.50,H*0.23],[W*0.60,H*0.19],[W*0.72,H*0.14]];
    ctx.strokeStyle='#cc000033'; ctx.lineWidth=1;
    ctx.beginPath(); s7.forEach((p,i)=>i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1])); ctx.stroke();
    s7.forEach(p=>{
      ctx.globalAlpha=vis*(0.4+Math.sin(t*0.1)*0.2); ctx.fillStyle='#cc4400';
      ctx.beginPath(); ctx.arc(p[0],p[1],3,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=vis;
    if (t>16) iCaptions(['HOKUTO SHINKEN HAS NO EQUAL.'],H*0.42,'#ffaa44',Math.max(0,t-16),2);
    if (t>56) iCaptions(['BUT WHEN BROTHERS TURN THEIR FISTS','AGAINST DESTINY—'],H*0.56,'#ffcc88',Math.max(0,t-56),1.8);
    if (t>100) iCaptions(['THE WORLD ITSELF WILL TREMBLE.'],H*0.76,'#ff6600',Math.max(0,t-100),2);

  // ══ Scene 5 : Ken walks forward — enemies close in ════════════════
  } else if (sc===5) {
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#0a0000'); sky.addColorStop(1,'#1e0800');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1c0d00'; ctx.fillRect(0,H*0.72,W,H);
    // Enemy silhouettes closing in (8 figures, 4 from each side)
    [[-260,0.79,1,1.0],[-175,0.82,1,0.84],[-95,0.77,1,0.70],[-28,0.80,1,0.56],
     [W+260,0.79,-1,1.0],[W+175,0.82,-1,0.84],[W+95,0.77,-1,0.70],[W+28,0.80,-1,0.56]
    ].forEach(([sx,yf,dir,sp])=>{
      const ent=Math.min(1,t/(100*sp));
      const ex=dir>0?sx+ent*(W*0.22-sx):sx+ent*(W*0.78-sx);
      ctx.save(); ctx.globalAlpha=vis*0.72;
      ctx.translate(ex,H*yf); ctx.scale(dir<0?-1.5:1.5,1.5);
      ctx.fillStyle='#0c0c0c';
      ctx.fillRect(-8,-44,16,36); ctx.beginPath(); ctx.arc(0,-54,10,0,Math.PI*2); ctx.fill();
      ctx.fillRect(-16,-40,10,8); ctx.fillRect(6,-40,10,8);
      ctx.fillRect(-8,12,6,22); ctx.fillRect(2,12,6,22);
      ctx.restore();
    });
    // Ken grows as he approaches
    const kenScl=0.55+Math.min(1,t/110)*1.9;
    ctx.save(); ctx.translate(W*0.5,H*0.88); ctx.scale(kenScl*2.0,kenScl*2.0);
    drawKen(0,0,1,af(fr)%28<14?'walk':'idle',af(fr),0);
    ctx.restore();
    if (t>88) iCaptions(['...THE WORLD ITSELF WILL TREMBLE.'],H*0.13,'#ff8800',Math.max(0,t-88),1.5);

  // ══ Scene 6 : Jacket tear — "You are already dead." ═══════════════
  } else if (sc===6) {
    const rg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,H);
    rg.addColorStop(0,'#300000'); rg.addColorStop(1,'#000');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    iSpeedLines(W/2,H/2,0,720,'#5a0000',96,Math.min(1,t/16)*0.78);

function _titleEase(t, dur) {
  // cubic ease-out over dur frames, clamped 0→1
  return Math.min(1, 1 - Math.pow(1 - Math.min(t, dur) / dur, 3));
}

function _charSlam(cx, cy, t, color) {
  // Radial speed-line burst + white flash on entry
  const age = Math.max(0, t);
  if (age > 22) return;
  const alpha = Math.max(0, 1 - age / 22);
  ctx.save();
  ctx.globalAlpha = alpha * 0.75;
  iSpeedLines(cx, cy - 80, 30, 480, color, 64, 1);
  ctx.globalAlpha = 1;
  ctx.restore();
  if (age < 6) {
    ctx.fillStyle = `rgba(255,255,255,${(6 - age) / 6 * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawKenPortrait(x,y,dir,state,fr,invincible) {

// ════════════════════════════════════════════════════════════════════
//  GAME LOOP
// ════════════════════════════════════════════════════════════════════
const TICK_MS = 1000 / 60;
let renderAlpha=1,smoothRender=false;
function visualValue(entity,key){
  const current=entity[key]||0,previous=entity.visualPrevious;
  if(!smoothRender||!previous||previous.state!==entity.state||previous.dir!==entity.dir)return current;
  return (previous[key]??current)+(current-(previous[key]??current))*renderAlpha;
}
function captureVisualPositions(){
  for(const r of [...PLAYERS,...GS.enemies,...(GS.boss?[GS.boss]:[])])
    r.visualPrevious={x:r.x,y:r.y,z:r.z||0,stride:r.stride||0,motionFr:r.motionFr||0,state:r.state,dir:r.dir};
}
let lastTick = null, accumulatedTime = 0;
function loop(now) {
  if (lastTick === null) lastTick = now;
  accumulatedTime += Math.min(now - lastTick, 100);
  lastTick = now;
  let didTick = false;
  while (accumulatedTime + 1e-7 >= TICK_MS) {
    if (didTick) clearKeys();
    captureVisualPositions();update();
    didTick = true;
    accumulatedTime = Math.max(0, accumulatedTime - TICK_MS);
  }
  smoothRender=GS.state==='playing'||GS.state==='boss';
  renderAlpha=clmp(accumulatedTime/TICK_MS,0,1);
  if (didTick || smoothRender) {
    if(typeof BACKGROUND_MUSIC!=='undefined'&&anyGpPress())BACKGROUND_MUSIC.start();
    render();
    if(didTick){clearKeys();updateGpPrev();}
  }
  window.GAME_ANALYTICS?.observe(GS.state,{
    mode:GS.mode,
    playerCount:GS.mode==='2p'?2:1,
    levelNumber:GS.lvlIdx+1,
    fighter:CHAR_DEFS[P1.charIdx]?.name||'Unknown'
  });
  smoothRender=false;
  requestAnimationFrame(loop);
}
