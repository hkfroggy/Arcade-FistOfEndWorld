<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playable character animations</title>
<style>body{margin:0;padding:28px;background:#17222e;color:#ebddbf;font:16px system-ui}main{max-width:1100px;margin:auto}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,a,select{font:inherit;color:inherit;background:#304455;border:1px solid #77818b;border-radius:6px;padding:9px 15px}button[aria-pressed=true]{background:#9c7137}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}article{background:#243545;border:1px solid #526576;border-radius:8px;text-align:center}canvas{width:100%;height:auto}p{color:#b8c4cc}</style>
<main><h1>Playable character animations</h1><p>Ken, Rei and Toki · 30 FPS playback · movement and combat sequences</p><nav id="actions"></nav><nav><button id="pause">Pause</button><label>Speed <select id="speed"><option value="1">Normal</option><option value="0.5">Half speed</option></select></label><a href="index.html">Play game</a><a href="characters.html">Character gallery</a></nav><section id="heroes"></section><p id="status">Loading animation sheets…</p></main>
<script src="assets/sprites/player-animations.js?v=roster-hd-1"></script><script>
const actions={idle:'Idle',walk:'Walk',jump:'Jump',punch:'Punch',kick:'Side kick',jumpkick:'Jump kick',special:'Special',stunned:'Hit reaction',knockdown:'Knockdown',getup:'Get up',landing:'Landing',punch_high:'High punch',punch_low:'Low punch',kick_high:'High kick',kick_low:'Low kick'};
let action='walk',paused=false,t=0,last=0,nextPaint=0;const cards=[],images={};
for(const [key,label] of Object.entries(actions)){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',key===action);b.onclick=()=>{action=key;t=0;document.querySelectorAll('#actions button').forEach(el=>el.setAttribute('aria-pressed',el===b));};document.getElementById('actions').append(b);}
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};
for(const name of ['ken','rei','toki']){const card=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=name==='ken'?'Kenshiro':name[0].toUpperCase()+name.slice(1);c.width=360;c.height=330;c.setAttribute('aria-label',h.textContent+' animation');card.append(h,c);document.getElementById('heroes').append(card);cards.push({name,c,ctx:c.getContext('2d')});}
for(const s of Object.values(window.PLAYER_ANIMATIONS)){if(!images[s.sheet]){const img=new Image();img.src=s.sheet;images[s.sheet]=img;}}
// Keep one scale per fighter so extended attacks fit without changing body size between poses.
const fit=Object.fromEntries(['ken','rei','toki'].map(name=>{let factor=1.2;for(const [key,s] of Object.entries(window.PLAYER_ANIMATIONS)){if(!key.startsWith(name+'_')||!s.regions)continue;s.regions.forEach(([x,y,w,h],i)=>{const anchor=s.anchors[i]-x;factor=Math.min(factor,164/(Math.max(anchor,w-anchor)*s.scale),210/(h*s.scale));});}return [name,factor];}));
function frame(now){const dt=last?Math.min(now-last,50):0;last=now;if(!paused)t+=dt*.06*Number(document.getElementById('speed').value);
if(now+1e-7<nextPaint){requestAnimationFrame(frame);return;}nextPaint+=1000/30;if(nextPaint<=now)nextPaint=now+1000/30;
for(const {name,c,ctx} of cards){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#344959';ctx.fillRect(0,286,360,2);const s=window.PLAYER_ANIMATIONS[name+'_'+action],img=images[s?.sheet];if(!s?.regions||!img?.complete||!img.naturalWidth)continue;
const count=s.regions.length,step=action==='walk'?((144/.7)/3.72/count):action==='idle'?18:5;const tick=Math.floor(t/step),period=Math.max(1,count*2-2),it=tick%period;const i=action==='idle'?(it<count?it:period-it):tick%count;const [x,y,w,h]=s.regions[i],k=s.scale*fit[name];let lift=0;if(action==='jump'||action==='jumpkick')lift=Math.sin((t%(count*step))/(count*step)*Math.PI)*65;
ctx.drawImage(img,x,y,w,h,180-(s.anchors[i]-x)*k,286-h*k-lift,w*k,h*k);ctx.fillStyle='#b8c4cc';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText(actions[action]+' · frame '+(i+1)+' / '+count,180,316);}
document.getElementById('status').textContent=Object.values(images).every(im=>im.complete&&im.naturalWidth)?'All animation sheets loaded':'Loading animation sheets…';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
